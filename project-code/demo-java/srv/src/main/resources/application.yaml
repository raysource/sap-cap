
---
# 默认 profile：本地用 H2 内存库，schema 由 cds-maven-plugin 生成的 schema-h2.sql 建好
spring:
  config.activate.on-profile: default
  sql.init.platform: h2
cds:
  data-source.auto-config.enabled: false
  # 本地开发的身份模拟。注意两点（都是本机实测踩到的）：
  #  ① 必须有 cds-starter-cloudfoundry 依赖，否则这段配置不生效（认证中间件不在 classpath 上）；
  #  ② 用「以用户名为键的 map」形式（官方示例 cloud-cap-samples-java 就是这个写法）。
  security:
    mock:
      users:
        alice:
          password: alice
          roles:
            - admin
        bob:
          password: bob
          roles: []
