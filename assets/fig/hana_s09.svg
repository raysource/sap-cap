db/src/gen/sap.training.bookorder.OrderItemView.hdbview</text><text x="24" y="204" font-size="12.5" fill="#79c0ff" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">   gen/db/src/gen/data/sap.training.bookorder-Books.hdbtabledata</text><text x="24" y="222.5" font-size="12.5" fill="#79c0ff" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">build completed in 171 ms</text><text x="24" y="259.5" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ cat gen/db/package.json          # 这就是 HDI deployer 的入口</text><text x="24" y="278" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  &quot;dependencies&quot;: { &quot;hdb&quot;: &quot;^2.0.0&quot;, &quot;@sap/hdi-deploy&quot;: &quot;^5&quot; },</text><text x="24" y="296.5" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  &quot;scripts&quot;: { &quot;start&quot;: &quot;node node_modules/@sap/hdi-deploy/deploy.js --use-hdb&quot; }</text><text x="24" y="333.5" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ cf deploy gen/mta.tar -f        # 或用 mbt build -t gen --mtar mta.tar</text><text x="24" y="352" font-size="12.5" fill="#e3d18a" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  demo-node-db-deployer (type: hdb) 执行 deploy.js → 在 HDI 容器里建表 + 装载 CSV</text><path d="M590.0 127.9 L249.0 127.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="577" y="114.875" width="193.12" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="590" cy="127.875" r="10" fill="#aa0808"/><text x="590" y="131.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">1</text><text x="606" y="132.375