ont-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">4</text><text x="672.25" y="354.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">4. 建表发生在部署阶段</text></svg>