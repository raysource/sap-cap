<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img"><rect x="0" y="0" width="1440" height="900" fill="#f5f6f7"/><rect x="0" y="0" width="1440" height="34" fill="#252526"/><circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="38" cy="17" r="6" fill="#ffbd2e"/><circle cx="56" cy="17" r="6" fill="#27c93f"/><text x="720" y="21.5" font-size="12.5" fill="#c8c8c8" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">jason@MacBook-Pro: ~/projects/demo-node — 模型编译路径（cds compile）</text><rect x="0" y="34" width="1440" height="866" fill="#1b1b1b"/><text x="24" y="56" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ npx cds compile db/schema.cds srv/book-order-service.cds --to sql</text><text x="24" y="94" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">CREATE TABLE sap_training_bookorder_Books (</text><text x="24" y="113" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  ID INTEGER NOT NULL,</text><text x="24" y="132" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  title NVARCHAR(120) NOT NULL,</text><text x="24" y="151" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  author NVARCHAR(80),</text><text x="24" y="170" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  price DECIMAL(9, 2) NOT NULL,</text><text x="24" y="189" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  currency NVARCHAR(3) DEFAULT 'JPY',</text><text x="24" y="208" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  stock INTEGER DEFAULT 0,</text><text x="24" y="227" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  PRIMARY KEY(ID)</text><text x="24" y="246" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">);</text><text x="24" y="284" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ npx cds compile srv/book-order-service.cds --to edmx | sed -n '26,44p'</text><text x="24" y="322" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">        &lt;EntitySet Name=&quot;Books&quot; EntityType=&quot;BookOrderService.Books&quot;/&gt;</text><text x="24" y="341" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">        &lt;EntitySet Name=&quot;BookOrders&quot; EntityType=&quot;BookOrderService.BookOrders&quot;&gt;</text><text x="24" y="360" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">          &lt;NavigationPropertyBinding Path=&quot;customer&quot; Target=&quot;Customers&quot;/&gt;</text><text x="24" y="379" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">          &lt;NavigationPropertyBinding Path=&quot;items&quot; Target=&quot;BookOrderItems&quot;/&gt;</text><text x="24" y="398" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">          &lt;NavigationPropertyBinding Path=&quot;SiblingEntity&quot; Target=&quot;BookOrders&quot;/&gt;</text><text x="24" y="417" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">        &lt;/EntitySet&gt;</text><text x="24" y="436" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">        &lt;EntitySet Name=&quot;OrderItemView&quot; EntityType=&quot;BookOrderService.OrderItemView&quot;/&gt;</text><text x="24" y="455" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">        &lt;FunctionImport Name=&quot;getOrderTotal&quot; Function=&quot;BookOrderService.getOrderTotal&quot;/&gt;</text><text x="24" y="474" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">        &lt;Action Name=&quot;submitOrder&quot; IsBound=&quot;true&quot;&gt;</text><text x="24" y="512" font-size="12.5" fill="#e3d18a" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace"> 运行时：cds watch 里同一批定义被 handler 直接引用（this.entities.BookOrders 等）</text><path d="M406.2 91.9 L185.2 91.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="393.25" y="78.875" width="209.44" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="406.25" cy="91.875" r="10" fill="#aa0808"/><text x="406.25" y="95.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">1</text><text x="422.25" y="96.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">1. 实体名 → 表名（下划线化）</text><path d="M657.5 338.9 L316.5 338.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="644.5" y="325.875" width="231.52" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="657.5" cy="338.875" r="10" fill="#aa0808"/><text x="657.5" y="342.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">2</text><text x="673.5" y="343.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">2. service 下的实体 = EntitySet</text><path d="M646.2 376.9 L305.2 376.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="633.25" y="363.875" width="192.64" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="646.25" cy="376.875" r="10" fill="#aa0808"/><text x="646.25" y="380.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">3</text><text x="662.25" y="381.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">3. $expand 靠这个导航绑定</text><path d="M802.5 471.9 L211.5 471.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="789.5" y="458.875" width="187.84" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="802.5" cy="471.875" r="10" fill="#aa0808"/><text x="802.5" y="475.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">4</text><text x="818.5" y="476.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">4. 绑定动作 IsBound=true</text><path d="M1110.0 452.9 L359.0 452.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="1097" y="439.875" width="292.48" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="1110" cy="452.875" r="10" fill="#aa0808"/><text x="1110" y="456.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">5</text><text x="1126" y="457.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">5. function = FunctionImport（不走实体）</text></svg>