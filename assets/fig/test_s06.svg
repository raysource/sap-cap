<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img"><rect x="0" y="0" width="1440" height="900" fill="#f5f6f7"/><rect x="0" y="0" width="1440" height="34" fill="#252526"/><circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="38" cy="17" r="6" fill="#ffbd2e"/><circle cx="56" cy="17" r="6" fill="#27c93f"/><text x="720" y="21.5" font-size="12.5" fill="#c8c8c8" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">jason@MacBook-Pro: ~/projects/demo-node — 手工验证：认证、method、动作与函数</text><rect x="0" y="34" width="1440" height="866" fill="#1b1b1b"/><text x="24" y="56" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ SVC=http://localhost:4004/odata/v4/book-order ; A='-u alice:alice'</text><text x="24" y="75" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s -o /dev/null -w '%{http_code}\n' &quot;$SVC/\$metadata&quot;                    # 不带认证</text><text x="24" y="94" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">401</text><text x="24" y="113" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s -o /dev/null -w '%{http_code}\n' $A &quot;$SVC/\$metadata&quot;                 # Basic Auth</text><text x="24" y="132" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">200</text><text x="24" y="151" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s $A &quot;$SVC/\$metadata&quot; | grep -c '&lt;EntitySet'</text><text x="24" y="170" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">5</text><text x="24" y="189" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s $A &quot;$SVC/BookOrders?\$count=true&amp;\$top=0&quot;</text><text x="24" y="208" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">{&quot;@odata.context&quot;:&quot;$metadata#BookOrders&quot;,&quot;@odata.count&quot;:4,&quot;value&quot;:[]}</text><text x="24" y="246" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s $A &quot;$SVC/getOrderTotal(orderNo='BO-1003')&quot;                            # function: GET</text><text x="24" y="265" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">{&quot;@odata.context&quot;:&quot;$metadata#Edm.Decimal&quot;,&quot;value&quot;:17400}</text><text x="24" y="284" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s -o /dev/null -w '%{http_code}\n' $A -X POST &quot;$SVC/getOrderTotal(orderNo='BO-1003')&quot; -d '{}'</text><text x="24" y="303" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">405</text><text x="24" y="341" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s -o /dev/null -w '%{http_code}\n' $A &quot;$SVC/BookOrders(ID=4a1f8c03-0001-…,IsActiveEntity=true)/submitOrder&quot;</text><text x="24" y="360" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">405</text><text x="24" y="379" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s $A -X POST &quot;$SVC/BookOrders(ID=4a1f8c03-0001-…,IsActiveEntity=true)/submitOrder&quot; -d '{}'   # action: POST</text><text x="24" y="398" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">{&quot;@odata.context&quot;:&quot;../$metadata#Edm.String&quot;,&quot;value&quot;:&quot;订单 BO-1001 已提交，合计 16000.00 JPY（3 行）&quot;}</text><text x="24" y="436" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s -o /dev/null -w '%{http_code}\n' $A -X DELETE &quot;$SVC/BookOrders(ID=$DID,IsActiveEntity=false)&quot;</text><text x="24" y="455" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">204</text><path d="M786.2 91.9 L35.2 91.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="773.25" y="78.875" width="174.88" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="786.25" cy="91.875" r="10" fill="#aa0808"/><text x="786.25" y="95.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">1</text><text x="802.25" y="96.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">1. 先确认 401 不是 bug</text><path d="M488.8 167.9 L27.8 167.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="475.75" y="154.875" width="178.72" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="488.75" cy="167.875" r="10" fill="#aa0808"/><text x="488.75" y="171.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">2</text><text x="504.75" y="172.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">2. 实体集数量对得上模型</text><path d="M623.8 205.9 L282.8 205.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="610.75" y="192.875" width="198.4" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="623.75" cy="205.875" r="10" fill="#aa0808"/><text x="623.75" y="209.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">3</text><text x="639.75" y="210.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">3. $count 取总数，不做分页</text><path d="M786.2 255.9 L35.2 357.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="773.25" y="242.875" width="281.44" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="786.25" cy="255.875" r="10" fill="#aa0808"/><text x="786.25" y="259.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">4</text><text x="802.25" y="260.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">4. action 只能 POST / function 只能 GET</text><path d="M136.2 486.9 L35.2 452.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="123.25" y="473.875" width="281.92" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="136.25" cy="486.875" r="10" fill="#aa0808"/><text x="136.25" y="490.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">5</text><text x="152.25" y="491.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">6. 丢草稿 = DELETE IsActiveEntity=false</text></svg>