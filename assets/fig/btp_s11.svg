<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img"><rect x="0" y="0" width="1440" height="900" fill="#f5f6f7"/><rect x="0" y="0" width="1440" height="34" fill="#252526"/><circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="38" cy="17" r="6" fill="#ffbd2e"/><circle cx="56" cy="17" r="6" fill="#27c93f"/><text x="720" y="21.5" font-size="12.5" fill="#c8c8c8" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">jason@MacBook-Pro: ~/projects/demo-node</text><rect x="0" y="34" width="1440" height="866" fill="#1b1b1b"/><text x="24" y="56" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ brew install cloudfoundry/tap/cf-cli@8</text><text x="24" y="74.5" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ cf --version</text><text x="24" y="93" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">cf version 8.x.y</text><text x="24" y="111.5" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ cf api https://api.cf.ap21.hana.ondemand.com</text><text x="24" y="130" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Setting api endpoint to https://api.cf.ap21.hana.ondemand.com...</text><text x="24" y="148.5" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">API endpoint:   https://api.cf.ap21.hana.ondemand.com</text><text x="24" y="167" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">api version:    3.x.0</text><text x="24" y="185.5" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ cf login -a https://api.cf.ap21.hana.ondemand.com --sso</text><text x="24" y="204" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">API endpoint: https://api.cf.ap21.hana.ondemand.com</text><text x="24" y="222.5" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Temporary Authentication Code (get one at https://login.cf.ap21.hana.ondemand.com/passcode):</text><text x="24" y="241" font-size="12.5" fill="#e3d18a" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace"> 浏览器打开该链接，把一次性验证码粘回终端</text><text x="24" y="259.5" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Authenticating...</text><text x="24" y="278" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">OK</text><text x="24" y="296.5" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ cf target</text><text x="24" y="315" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">api endpoint:   https://api.cf.ap21.hana.ondemand.com</text><text x="24" y="333.5" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">user:           jason@example.com</text><text x="24" y="352" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">org:            trial</text><text x="24" y="370.5" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">space:          dev</text><text x="24" y="389" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ cf spaces</text><text x="24" y="407.5" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Getting spaces in org trial as jason@example.com...</text><text x="24" y="426" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">name</text><text x="24" y="444.5" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">dev</text><text x="24" y="463" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">test</text><text x="24" y="481.5" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ cf marketplace -e hana</text><text x="24" y="500" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Getting service plan information for service hana as jason@example.com...</text><text x="24" y="518.5" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">broker: hana-broker</text><text x="24" y="537" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">plan         description        free or paid</text><text x="24" y="555.5" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">hdi-shared   HDI container      free</text><text x="24" y="574" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">schema       Schema             free</text><text x="24" y="592.5" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">securestore  Secure Store       free</text><path d="M578.8 183.4 L237.8 183.4" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="565.75" y="170.375" width="202.72" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="578.75" cy="183.375" r="10" fill="#aa0808"/><text x="578.75" y="187.375" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">1</text><text x="594.75" y="187.875" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">1. 端点必须与子账户区域一致</text><path d="M196.2 368.4 L95.2 368.4" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="183.25" y="355.375" width="198.4" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="196.25" cy="368.375" r="10" fill="#aa0808"/><text x="196.25" y="372.375" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">2</text><text x="212.25" y="372.875" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">2. 目标 space 决定部署位置</text><path d="M380.0 553.4 L159.0 553.4" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="367" y="540.375" width="166.72" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="380" cy="553.375" r="10" fill="#aa0808"/><text x="380" y="557.375" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">3</text><text x="396" y="557.875" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">3. 先确认计划真的存在</text><path d="M830.0 220.4 L369.0 220.4" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="817" y="207.375" width="190.72" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="830" cy="220.375" r="10" fill="#aa0808"/><text x="830" y="224.375" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">4</text><text x="846" y="224.875" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">4. 一次性验证码，短时有效</text></svg>