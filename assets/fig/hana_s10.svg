ext x="409.375" y="153.25" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">2</text><text x="425.375" y="153.75" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">2. 实例名（不是 schema）</text><path d="M831.8 444.2 L490.8 444.2" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="818.75" y="431.25" width="166.72" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="831.75" cy="444.25" r="10" fill="#aa0808"/><text x="831.75" y="448.25" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">3</text><text x="847.75" y="448.75" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">3. 直连被拒多半是这里</text><path d="M430.0 490.2 L329.0 490.2" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="417" y="477.25" width="179.2" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="430" cy="490.25" r="10" fill="#aa0808"/><text x="430" y="494.25" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">4</text><text x="446" y="494.75" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">4. 高级设置随版本变化 ~</text></svg>