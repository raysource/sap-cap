','Microsoft YaHei',sans-serif" text-anchor="end">另一种是 SAP HANA Cloud, data lake</text><text x="252" y="331" font-size="12" fill="#6a6d70" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">Instance Name</text><rect x="252" y="337" width="936" height="26" rx="4" fill="#ffffff" stroke="#d9d9d9" stroke-width="1"/><text x="260" y="354.375" font-size="12.5" fill="#1d2d3e" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">demo-hana</text><text x="1184" y="331" font-size="11.5" fill="#0070f2" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="end">实例名会出现在 Cloud Central</text><text x="252" y="377" font-size="12" fill="#6a6d70" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">Administrator</text><rect x="252" y="383" width="936" height="26" rx="4" fill="#ffffff" stroke="#d9d9d9" stroke-width="1"/><text x="260" y="400.375" font-size="12.5" fill="#1d2d3e" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">DBADMIN</text><text x="1184" y="377" font-size="11.5" fill="#0070f2" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="end">密码在此步设置</text><text x="252" y="423" font-size="12" fill="#6a6d70" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">Connections</text><rect x="252" y="429" width="936" height="26" rx="4" fill="#ffffff" stroke="#d9d9d9" stroke-width="1"/><text x="260" y="446.375" font-size="12.5" fill="#1d2d3e" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">~ Allow all IP addresses / Deny all IP addresses (except SAP platforms)</text><text x="1184" y="423" font-size="11.5" fill="#0070f2" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="end">只要能从 BAS / 本地直连，就选允许；默认常是「拒绝」</text><text x="252" y="469" font-size="12" fill="#6a6d70" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">Advanced Settings</text><rect x="252" y="475" width="936" height="26" rx="4" fill="#ffffff" stroke="#d9d9d9" stroke-width="1"/><text x="260" y="492.375" font-size="12.5" fill="#1d2d3e" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">~ 备份、数据湖、证书等</text><text x="1184" y="469" font-size="11.5" fill="#0070f2" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="end">试用/免费层多数只读</text><rect x="252" y="510" width="936" height="37" rx="6" fill="#e8f0fb"/><circle cx="268" cy="528.5" r="8" fill="#0070f2"/><text x="268" y="532.5" font-size="11" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">!</text><text x="284" y="532" font-size="12.5" fill="#1d2d3e" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">CAP 部署到 CF 时不需要把开发机 IP 加进白名单：应用与 HDI 容器都在 BTP 内部通信。</text><rect x="252" y="557" width="936" height="37" rx="6" fill="#fdf3e8"/><circle cx="268" cy="575.5" r="8" fill="#e76500"/><text x="268" y="579.5" font-size="11" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">!</text><text x=