ploying services...</text><text x="24" y="496" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  demo-hana-db (hana-cloud, hdi-shared)  -&gt; created</text><text x="24" y="516" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  demo-xsuaa (xsuaa, application)        -&gt; created</text><text x="24" y="556" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Process finished.</text><text x="24" y="576" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Use &quot;cf dmol -i 8f2c41d9&quot; to download the logs of the process.</text><text x="24" y="616" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ cf logs demo-node-srv --recent | tail -6</text><text x="24" y="636" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">   2026-09-19T21:36:02.11+0900 [APP/PROC/WEB/0] OUT [cds] - serving BookOrderService { at: '/odata/v4/book-order' }</text><text x="24" y="656" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">   2026-09-19T21:36:02.11+0900 [APP/PROC/WEB/0] OUT [cds] - using HANA from service demo-hana-db</text><text x="24" y="676" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">   2026-09-19T21:36:03.04+0900 [APP/PROC/WEB/0] OUT Server listening on port 8080</text><text x="24" y="716" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s https://trial-dev-demo-node.cfapps.ap10.hana.ondemand.com/odata/v4/book-order/BookOrders?\$top=1</text><text x="24" y="736" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">{&quot;@odata.context&quot;:&quot;$metadata#BookOrders&quot;,&quot;value&q