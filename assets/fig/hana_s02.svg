/text><text x="906" y="236" font-size="12.5" fill="#6a6d70" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">Review</text><text x="252" y="275" font-size="12" fill="#6a6d70" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">Service</text><rect x="252" y="281" width="936" height="26" rx="4" fill="#ffffff" stroke="#d9d9d9" stroke-width="1"/><text x="260" y="298.375" font-size="12.5" fill="#1d2d3e" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">SAP HANA Schemas &amp; HDI Containers (hana)</text><text x="1184" y="275" font-size="11.5" fill="#0070f2" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="end">数据库实例用 SAP HANA Cloud 服务</text><text x="252" y="321" font-size="12" fill="#6a6d70" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">Plan</text><rect x="252" y="327" width="936" height="26" rx="4" fill="#ffffff" stroke="#d9d9d9" stroke-width="1"/><text x="260" y="344.375" font-size="12.5" fill="#1d2d3e" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">hdi-shared</text><text x="1184" y="321" font-size="11.5" fill="#0070f2" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="end">hdi-shared / schema / securestore</text><text x="252" y="367" font-size="12" fill="#6a6d70" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">Instance Name</text><rect x="252" y="373" width="936" height="26" rx="4" fill="#ffffff" stroke="#d9d9d9" stroke-width="1"/><text x="260" y="390.375" font-size="12.5" fill="#1d2d3e" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">demo-hana-db</text><text x="1184" y="367" font-size="11.5" fill="#0070f2" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="end">与 mta.yaml 的 resource 名保持一致更清晰</text><text x="252" y="413" font-size="12" fill="#6a6d70" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">Parameters (JSON)</text><rect x="252" y="419" width="936" height="26" rx="4" fill="#ffffff" stroke="#d9d9d9" stroke-width="1"/><text x="260" y="436.375" font-size="12.5" fill="#1d2d3e" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">{ &quot;schema&quot;: &quot;BOOKORDER&quot;, &quot;database_id&quot;: &quot;&lt;HANA Cloud 实例 ID&gt;&quot; }</text><text x="1184" y="413" font-size="11.5" fill="#0070f2" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="end">database_id 从 Cloud Central 的 ⋯ &gt; Copy Instance ID 取得</text><rect x="252" y="454" width="936" height="37" rx="6" fill="#e8f0fb"/><circle cx="268" cy="472.5" r="8" fill="#0070f2"/><text x="268" y="476.5" font-size="11" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">!</text><text x="284" y="476" font-size="12.5" fill="#1d2d3e" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">CLI 等价命令：cf create-service hana hdi-shared demo-hana-db -c '{ &quot;schema&quot;: &quot;BOOKORDER&quot; }'（服务名以 cf marketplace 的输出为准）。</text><rect x="252" y="501" width="936" height="37" rx="6" fill="#fdf3e8"/><circle cx="268" cy="519.5" r="8" fill="#e76500"/><text x="268" y="523.5" font-size="11" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">!</text><text x="284" y="523" font-size="12.5" fill="#1d2d3e" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">指定 schema 只是给容器一个「建议名」；实际 schema 名可能被加密后缀修饰，以绑定凭据里的 schema 字段为准。</text><line x1="230" y1="704" x2="1210" y2="704" stroke="#e5e5e5" stroke-width="1"/><rect x="1119.5" y="717" width="74.5" height="30" rx="6" fill="#0070f2"/><text x="1156.75" y="736.375" font-size="12.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">Create</text><rect x="1035" y="717" width="74.5" height="30" rx="6" fill="#ffffff" stroke="#d9d9d9" stroke-width="1"/><text x="1072.25" y="736.375" font-size="12.5" fill="#0070f2" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">Cancel</text><path d="M951.8 161.2 L1190.8 161.2" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="938.773" y="148.25" width="164.32" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="951.773" cy="161.25" r="10" fill="#aa0808"/><text x="951.773" y="165.25" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">1</text><text x="967.773" y="165.75" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">1. CAP 用 hdi-shared</text><path d="M83.5 161.2 L322.5 161.2" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="70.5" y="148.25" width="169.12" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="83.5" cy="161.25" r="10" fill="#aa0808"/><text x="83.5" y="165.25" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">2</text><text x="99.5" y="165.75" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">2. 实例名 ≠ schema 名</text><path d="M688.5 434.2 L467.5 434.2" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="675.5" y="421.25" width="253.6" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="688.5" cy="434.25" r="10" fill="#aa0808"/><text x="688.5" y="438.25" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">3</text><text x="704.5" y="438.75" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">3. database_id 绑定到具体数据库实例</text><path d="M1166.5 473.9 L705.5 473.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="1153.5" y="460.875" width="214.72" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="1166.5" cy="473.875" r="10" fill="#aa0808"/><text x="1166.5" y="477.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">4</text><text x="1182.5" y="478.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">4. 服务名随环境不同，先查再建</text></svg>