<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img"><rect x="0" y="0" width="1440" height="900" fill="#f5f6f7"/><rect x="0" y="0" width="1440" height="34" fill="#252526"/><circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="38" cy="17" r="6" fill="#ffbd2e"/><circle cx="56" cy="17" r="6" fill="#27c93f"/><text x="720" y="21.5" font-size="12.5" fill="#c8c8c8" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">jason@MacBook-Pro: ~/projects/demo-node — OData 读请求实测</text><rect x="0" y="34" width="1440" height="866" fill="#1b1b1b"/><text x="24" y="56" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ SVC=http://localhost:4004/odata/v4/book-order ; A='-u alice:alice'</text><text x="24" y="75" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s $A &quot;$SVC/BookOrders?$select=orderNo,status,totalAmount&amp;$orderby=orderNo&quot;</text><text x="24" y="94" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">{&quot;@odata.context&quot;:&quot;$metadata#BookOrders&quot;,&quot;value&quot;:[</text><text x="24" y="113" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  {&quot;orderNo&quot;:&quot;BO-1001&quot;,&quot;status&quot;:&quot;OPEN&quot;,&quot;totalAmount&quot;:16000,&quot;ID&quot;:&quot;4a1f8c03-0001-…&quot;,&quot;IsActiveEntity&quot;:true},</text><text x="24" y="132" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  {&quot;orderNo&quot;:&quot;BO-1002&quot;,&quot;status&quot;:&quot;OPEN&quot;,&quot;totalAmount&quot;:3600,&quot;ID&quot;:&quot;4a1f8c03-0002-…&quot;,&quot;IsActiveEntity&quot;:true},</text><text x="24" y="151" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  {&quot;orderNo&quot;:&quot;BO-1003&quot;,&quot;status&quot;:&quot;SUBMITTED&quot;,&quot;totalAmount&quot;:17400,&quot;ID&quot;:&quot;4a1f8c03-0003-…&quot;,&quot;IsActiveEntity&quot;:true},</text><text x="24" y="170" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  {&quot;orderNo&quot;:&quot;BO-1004&quot;,&quot;status&quot;:&quot;CLOSED&quot;,&quot;totalAmount&quot;:7600,&quot;ID&quot;:&quot;4a1f8c03-0004-…&quot;,&quot;IsActiveEntity&quot;:true}]}</text><text x="24" y="208" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s $A &quot;$SVC/BookOrders?$filter=orderNo eq 'BO-1001'&amp;$expand=items&quot;</text><text x="24" y="227" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">{&quot;@odata.context&quot;:&quot;$metadata#BookOrders&quot;,&quot;value&quot;:[{&quot;ID&quot;:&quot;4a1f8c03-0001-…&quot;,&quot;orderNo&quot;:&quot;BO-1001&quot;,</text><text x="24" y="246" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  &quot;customer_ID&quot;:1000,&quot;orderDate&quot;:&quot;2026-09-01&quot;,&quot;status&quot;:&quot;OPEN&quot;,&quot;totalAmount&quot;:16000,</text><text x="24" y="265" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  &quot;items&quot;:[{&quot;ID&quot;:&quot;5b2f9d10-0001-…&quot;,&quot;book_ID&quot;:1001,&quot;quantity&quot;:2,&quot;amount&quot;:8400},</text><text x="24" y="284" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">           {&quot;ID&quot;:&quot;5b2f9d10-0002-…&quot;,&quot;book_ID&quot;:1003,&quot;quantity&quot;:1,&quot;amount&quot;:2800},</text><text x="24" y="303" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">           {&quot;ID&quot;:&quot;5b2f9d10-0003-…&quot;,&quot;book_ID&quot;:1005,&quot;quantity&quot;:1,&quot;amount&quot;:4800}],&quot;IsActiveEntity&quot;:true}]}</text><text x="24" y="341" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s $A &quot;$SVC/getOrderSummary()&quot;</text><text x="24" y="360" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">{&quot;@odata.context&quot;:&quot;$metadata#Collection(BookOrderService.OrderSummaryRow)&quot;,&quot;value&quot;:[</text><text x="24" y="379" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  {&quot;orderNo&quot;:&quot;BO-1001&quot;,&quot;customerName&quot;:&quot;北京华信书业&quot;,&quot;orderDate&quot;:&quot;2026-09-01&quot;,&quot;status&quot;:&quot;OPEN&quot;,&quot;itemCount&quot;:3,&quot;totalAmount&quot;:16000},</text><text x="24" y="398" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  {&quot;orderNo&quot;:&quot;BO-1002&quot;,&quot;customerName&quot;:&quot;北京华信书业&quot;,&quot;orderDate&quot;:&quot;2026-09-03&quot;,&quot;status&quot;:&quot;OPEN&quot;,&quot;itemCount&quot;:1,&quot;totalAmount&quot;:3600},</text><text x="24" y="417" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  {&quot;orderNo&quot;:&quot;BO-1003&quot;,&quot;customerName&quot;:&quot;上海博文出版中心&quot;,&quot;orderDate&quot;:&quot;2026-09-05&quot;,&quot;status&quot;:&quot;SUBMITTED&quot;,&quot;itemCount&quot;:3,&quot;totalAmount&quot;:17400},</text><text x="24" y="436" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  {&quot;orderNo&quot;:&quot;BO-1004&quot;,&quot;customerName&quot;:&quot;广州南方图书&quot;,&quot;orderDate&quot;:&quot;2026-09-08&quot;,&quot;status&quot;:&quot;CLOSED&quot;,&quot;itemCount&quot;:2,&quot;totalAmount&quot;:7600}]}</text><text x="24" y="474" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s -o /dev/null -w '%{http_code}\n' &quot;$SVC/BookOrders&quot;                      # 匿名</text><text x="24" y="493" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">401</text><text x="24" y="512" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s -o /dev/null -w '%{http_code}\n' $A -X POST &quot;$SVC/OrderItemView&quot; -d '{}'  # 只读实体</text><text x="24" y="531" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">405</text><path d="M878.8 110.9 L417.8 110.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="865.75" y="97.875" width="253.6" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="878.75" cy="110.875" r="10" fill="#aa0808"/><text x="878.75" y="114.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">1</text><text x="894.75" y="115.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">1. $select 只取指定列(+键/草稿标记)</text><path d="M907.5 281.9 L316.5 281.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="894.5" y="268.875" width="236.32" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="907.5" cy="281.875" r="10" fill="#aa0808"/><text x="907.5" y="285.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">2</text><text x="923.5" y="286.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">2. $expand 由导航属性 items 驱动</text><path d="M1091.2 376.9 L500.2 376.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="1078.25" y="363.875" width="226.72" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="1091.25" cy="376.875" r="10" fill="#aa0808"/><text x="1091.25" y="380.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">3</text><text x="1107.25" y="381.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">3. 聚合只能靠函数（视图无主键）</text><path d="M786.2 490.9 L35.2 490.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="773.25" y="477.875" width="194.56" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="786.25" cy="490.875" r="10" fill="#aa0808"/><text x="786.25" y="494.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">4</text><text x="802.25" y="495.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">4. @requires 不满足 → 401</text><path d="M786.2 528.9 L35.2 528.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="773.25" y="515.875" width="218.56" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="786.25" cy="528.875" r="10" fill="#aa0808"/><text x="786.25" y="532.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">5</text><text x="802.25" y="533.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">5. @readonly 实体写操作 → 405</text></svg>