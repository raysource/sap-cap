<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img"><rect x="0" y="0" width="1440" height="900" fill="#f5f6f7"/><rect x="0" y="0" width="1440" height="34" fill="#252526"/><circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="38" cy="17" r="6" fill="#ffbd2e"/><circle cx="56" cy="17" r="6" fill="#27c93f"/><text x="720" y="21.5" font-size="12.5" fill="#c8c8c8" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">jason@MacBook-Pro: ~/projects/demo-node</text><rect x="0" y="34" width="1440" height="866" fill="#1b1b1b"/><text x="24" y="56" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ npx cds env get requires.db</text><text x="24" y="74.5" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  { &quot;impl&quot;: &quot;@cap-js/sqlite&quot;, &quot;kind&quot;: &quot;sqlite&quot;,</text><text x="24" y="93" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">    &quot;credentials&quot;: { &quot;url&quot;: &quot;db.sqlite&quot; }, &quot;data&quot;: [ &quot;db/data&quot; ] }</text><text x="24" y="130" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ npx cds env get requires.db --profile production</text><text x="24" y="148.5" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  { &quot;impl&quot;: &quot;@cap-js/hana&quot;, &quot;kind&quot;: &quot;hana&quot; }   # 生产 profile 决定用 HANA</text><text x="24" y="185.5" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ npx cds compile db/schema.cds srv/book-order-service.cds --to sql | head -3</text><text x="24" y="204" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  CREATE TABLE sap_training_bookorder_Books (</text><text x="24" y="222.5" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">    ID INTEGER NOT NULL,</text><text x="24" y="241" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">    title NVARCHAR(120) NOT NULL,</text><text x="24" y="259.5" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">    price DECIMAL(9, 2) NOT NULL,</text><text x="24" y="278" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">    PRIMARY KEY(ID) );</text><text x="24" y="315" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ npm run deploy</text><text x="24" y="333.5" font-size="12.5" fill="#79c0ff" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">&gt; cds deploy --to sqlite:db.sqlite</text><text x="24" y="352" font-size="12.5" fill="#e3d18a" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  &gt; init from db/data/sap.training.bookorder-Books.csv</text><text x="24" y="370.5" font-size="12.5" fill="#e3d18a" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  &gt; init from db/data/sap.training.bookorder-BookOrders.csv</text><text x="24" y="389" font-size="12.5" fill="#e3d18a" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  &gt; init from db/data/sap.training.bookorder-BookOrderItems.csv</text><text x="24" y="407.5" font-size="12.5" fill="#e3d18a" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  &gt; init from db/data/sap.training.bookorder-Customers.csv</text><text x="24" y="426" font-size="12.5" fill="#79c0ff" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace"> successfully deployed to db.sqlite</text><path d="M593.8 87.9 L132.8 53.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="580.75" y="74.875" width="166.72" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="593.75" cy="87.875" r="10" fill="#aa0808"/><text x="593.75" y="91.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">1</text><text x="609.75" y="92.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">1. 先看「生效的」配置</text><path d="M632.5 146.4 L291.5 146.4" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="619.5" y="133.375" width="186.88" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="632.5" cy="146.375" r="10" fill="#aa0808"/><text x="632.5" y="150.375" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">2</text><text x="648.5" y="150.875" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">2. 切 profile 就换数据库</text><path d="M653.8 201.9 L192.8 201.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="640.75" y="188.875" width="257.92" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="653.75" cy="201.875" r="10" fill="#aa0808"/><text x="653.75" y="205.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">3</text><text x="669.75" y="206.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">3. 表名 = 命名空间+实体（点→下划线）</text><path d="M496.2 423.9 L155.2 423.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="483.25" y="410.875" width="142.72" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="496.25" cy="423.875" r="10" fill="#aa0808"/><text x="496.25" y="427.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">4</text><text x="512.25" y="428.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">4. 建库成功的判据</text></svg>