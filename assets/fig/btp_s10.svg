<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img"><rect x="0" y="0" width="1440" height="900" fill="#f5f6f7"/><rect x="0" y="0" width="1440" height="34" fill="#252526"/><circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="38" cy="17" r="6" fill="#ffbd2e"/><circle cx="56" cy="17" r="6" fill="#27c93f"/><text x="720" y="21.5" font-size="12.5" fill="#c8c8c8" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">jason@MacBook-Pro: ~/projects/demo-node</text><rect x="0" y="34" width="1440" height="866" fill="#1b1b1b"/><text x="24" y="56" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ brew install --cask btp</text><text x="24" y="74.5" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ btp --version</text><text x="24" y="93" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">SAP BTP command line interface (btp CLI)</text><text x="24" y="111.5" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ btp login --sso</text><text x="24" y="130" font-size="12.5" fill="#e3d18a" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace"> 提示确认 CLI server URL，直接回车</text><text x="24" y="148.5" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">CLI server URL (https://cli.btp.cloud.sap/): </text><text x="24" y="167" font-size="12.5" fill="#e3d18a" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace"> 浏览器里完成 SSO，回到终端</text><text x="24" y="185.5" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ btp target</text><text x="24" y="204" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Global account: trial-9f3a2b (trial)</text><text x="24" y="222.5" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ btp list accounts/subaccount</text><text x="24" y="241" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Subaccount ID                          Display Name  Region  State</text><text x="24" y="259.5" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">9c1e4d70-1a2b-4c3d-8e4f-5a6b7c8d9e0f   trial         ap21    OK</text><text x="24" y="278" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ btp get security/user &quot;jason@example.com&quot;</text><text x="24" y="296.5" font-size="12.5" fill="#e3d18a" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace"> 输出里能看到该用户已分配的角色集合</text><path d="M338.8 87.9 L117.8 53.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="325.75" y="74.875" width="174.4" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="338.75" cy="87.875" r="10" fill="#aa0808"/><text x="338.75" y="91.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">1</text><text x="354.75" y="92.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">1. 官方 macOS 安装方式</text><path d="M548.8 109.4 L87.8 109.4" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="535.75" y="96.375" width="190.72" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="548.75" cy="109.375" r="10" fill="#aa0808"/><text x="548.75" y="113.375" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">2</text><text x="564.75" y="113.875" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">2. 走浏览器，终端不输密码</text><path d="M413.8 146.4 L192.8 146.4" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="400.75" y="133.375" width="142.72" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="413.75" cy="146.375" r="10" fill="#aa0808"/><text x="413.75" y="150.375" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">3</text><text x="429.75" y="150.875" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">3. 默认服务器地址</text><path d="M601.2 257.4 L260.2 257.4" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="588.25" y="244.375" width="186.88" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="601.25" cy="257.375" r="10" fill="#aa0808"/><text x="601.25" y="261.375" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">4</text><text x="617.25" y="261.875" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">4. 区域要和 cockpit 对上</text></svg>