<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img"><rect x="0" y="0" width="1440" height="900" fill="#f5f6f7"/><rect x="0" y="0" width="1440" height="34" fill="#252526"/><circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="38" cy="17" r="6" fill="#ffbd2e"/><circle cx="56" cy="17" r="6" fill="#27c93f"/><text x="720" y="21.5" font-size="12.5" fill="#c8c8c8" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">jason@MacBook-Pro: ~/Desktop/work/training/sap-cap/project-code/demo-node</text><rect x="0" y="34" width="1440" height="866" fill="#1b1b1b"/><text x="24" y="56" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ npx cds compile /tmp/cdserr/hash.cds --to sql</text><text x="24" y="75" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">[ERROR] hash.cds:2:30-31: Mismatched ‘#’, expecting ‹Identifier›, ‘}’, ‘@’, ‘key’, ‘virtual’</text><text x="24" y="113" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ npx cds compile /tmp/cdserr/eof.cds --to sql</text><text x="24" y="132" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">[ERROR] eof.cds:4:1-1: Mismatched ‹EOF›, expecting ‹Identifier›, ‘}’, ‘@’, ‘key’, ‘virtual’</text><text x="24" y="170" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ npx cds compile db/schema.cds srv/no_redir.cds --to edmx</text><text x="24" y="189" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">[ERROR] srv/no_redir.cds:16:10: Add “@cds.redirection.target” to either “BookOrderService.BookOrderItems” or</text><text x="24" y="208" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">        “BookOrderService.OrderItemView” to select the entity as redirection target for</text><text x="24" y="227" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">        “sap.training.bookorder.BookOrderItems” ... can't auto-redirect “BookOrders:items” otherwise</text><text x="24" y="265" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ npx cds deploy --to sqlite:db.sqlite      # CSV 表头写成 orders_ID</text><text x="24" y="284" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  &gt; init from db/data/sap.training.bookorder-BookOrderItems.csv</text><text x="24" y="303" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">/&gt; deployment to db.sqlite failed</text><text x="24" y="341" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">SqliteError: in cds.deploy(): table sap_training_bookorder_BookOrderItems has no column</text><text x="24" y="360" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">named orders_ID in: INSERT INTO ... (ID,orders_ID,book_ID,quantity,amount,...)</text><text x="24" y="398" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ npx cds compile /tmp/cdsue/c6.cds --to sql</text><text x="24" y="417" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">[ERROR] c6.cds:8:39-40: Unmanaged associations can't be used in expressions in queries</text><text x="24" y="436" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">        (in entity:“ue.V”/column:“n”)</text><text x="24" y="474" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ npx cds compile /tmp/cdserr/nokey_view.cds --to edmx    # 服务里暴露无主键视图</text><text x="24" y="493" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">[ERROR] nokey_view.cds:3:20: Expected entity to have a primary key (in entity:“e.S.V”)</text><path d="M830.0 72.9 L369.0 72.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="817" y="59.875" width="202.72" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="830" cy="72.875" r="10" fill="#aa0808"/><text x="830" y="76.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">1</text><text x="846" y="77.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">1. 位置精确到列，先看报错行</text><path d="M860.0 224.9 L399.0 224.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="847" y="211.875" width="202.72" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="860" cy="224.875" r="10" fill="#aa0808"/><text x="860" y="228.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">2</text><text x="876" y="229.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">2. 报错里直接给了修复注解名</text><path d="M777.5 357.9 L316.5 357.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="764.5" y="344.875" width="270.4" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="777.5" cy="357.875" r="10" fill="#aa0808"/><text x="777.5" y="361.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">3</text><text x="793.5" y="362.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">3. CSV 表头 = 物理列名，写错就整批回滚</text><path d="M687.5 490.9 L346.5 490.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="674.5" y="477.875" width="241.6" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="687.5" cy="490.875" r="10" fill="#aa0808"/><text x="687.5" y="494.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">4</text><text x="703.5" y="495.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">4. 视图没有 key，cds2edm 直接拒绝</text></svg>