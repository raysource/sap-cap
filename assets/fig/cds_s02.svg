<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img"><rect x="0" y="0" width="1440" height="900" fill="#f5f6f7"/><rect x="0" y="0" width="1440" height="34" fill="#252526"/><circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="38" cy="17" r="6" fill="#ffbd2e"/><circle cx="56" cy="17" r="6" fill="#27c93f"/><text x="720" y="21.5" font-size="12.5" fill="#c8c8c8" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">jason@MacBook-Pro: ~/Desktop/work/training/sap-cap/project-code/demo-node</text><rect x="0" y="34" width="1440" height="866" fill="#1b1b1b"/><text x="24" y="56" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ npx cds compile db/schema.cds --to sql</text><text x="24" y="96" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">CREATE TABLE sap_training_bookorder_Books (</text><text x="24" y="116" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  ID INTEGER NOT NULL,</text><text x="24" y="136" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  title NVARCHAR(120) NOT NULL,</text><text x="24" y="156" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  author NVARCHAR(80),</text><text x="24" y="176" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  price DECIMAL(9, 2) NOT NULL,</text><text x="24" y="196" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  currency NVARCHAR(3) DEFAULT 'JPY',</text><text x="24" y="216" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  stock INTEGER DEFAULT 0,</text><text x="24" y="236" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  PRIMARY KEY(ID)</text><text x="24" y="256" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">);</text><text x="24" y="296" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">CREATE TABLE sap_training_bookorder_BookOrders (</text><text x="24" y="316" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  createdAt TIMESTAMP_TEXT,</text><text x="24" y="336" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  createdBy NVARCHAR(255),</text><text x="24" y="356" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  modifiedAt TIMESTAMP_TEXT,</text><text x="24" y="376" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  modifiedBy NVARCHAR(255),</text><text x="24" y="396" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  ID NVARCHAR(36) NOT NULL,</text><text x="24" y="416" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  orderNo NVARCHAR(16) NOT NULL,</text><text x="24" y="436" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  customer_ID INTEGER,</text><text x="24" y="456" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  orderDate DATE_TEXT DEFAULT CURRENT_TIMESTAMP,</text><text x="24" y="476" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  status NVARCHAR(10) DEFAULT 'OPEN',</text><text x="24" y="496" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  note NVARCHAR(255),</text><text x="24" y="516" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  totalAmount DECIMAL(13, 2) DEFAULT 0,</text><text x="24" y="536" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  statusCriticality INTEGER DEFAULT 2,</text><text x="24" y="556" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  PRIMARY KEY(ID)</text><text x="24" y="576" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">);</text><text x="24" y="616" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">CREATE TABLE sap_training_bookorder_BookOrderItems (</text><text x="24" y="636" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  ID NVARCHAR(36) NOT NULL,</text><text x="24" y="656" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  order_ID NVARCHAR(36),</text><text x="24" y="676" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  book_ID INTEGER,</text><text x="24" y="696" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  quantity INTEGER DEFAULT 1,</text><text x="24" y="716" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  amount DECIMAL(13, 2),</text><text x="24" y="736" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  PRIMARY KEY(ID)</text><text x="24" y="756" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">);</text><path d="M466.2 313.9 L125.2 313.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="453.25" y="300.875" width="175.36" height="26" rx="13" fill="#ffffff" stroke="#aa0808" str