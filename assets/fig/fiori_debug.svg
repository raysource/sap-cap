<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img"><rect x="0" y="0" width="1440" height="900" fill="#f5f6f7"/><rect x="0" y="0" width="1440" height="34" fill="#252526"/><circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="38" cy="17" r="6" fill="#ffbd2e"/><circle cx="56" cy="17" r="6" fill="#27c93f"/><text x="720" y="21.5" font-size="12.5" fill="#c8c8c8" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">jason@MacBook-Pro: ~/projects/demo-node — 空白页三步定位（本地实测）</text><rect x="0" y="34" width="1440" height="866" fill="#1b1b1b"/><text x="24" y="56" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ # 步骤①：应用的三份入口资源是否可达（对应浏览器 Network 面板）</text><text x="24" y="76" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s -o /dev/null -w '%{http_code} %{content_type}\n' http://localhost:4004/book-orders/webapp/index.html</text><text x="24" y="96" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">200 text/html; charset=utf-8</text><text x="24" y="116" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s -o /dev/null -w '%{http_code} %{content_type}\n' http://localhost:4004/book-orders/webapp/manifest.json</text><text x="24" y="136" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">200 application/json; charset=utf-8</text><text x="24" y="156" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s -o /dev/null -w '%{http_code}\n' http://localhost:4004/book-orders/index.html</text><text x="24" y="176" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">404                      # 注意：目录地址没有 index.html，应用入口在 webapp/ 下</text><text x="24" y="216" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ # 步骤②：服务与认证（对应 console 里的 401 / Failed to load metadata）</text><text x="24" y="236" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s -o /dev/null -w '%{http_code}\n' http://localhost:4004/odata/v4/book-order/$metadata</text><text x="24" y="256" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">401                      # 匿名被挡：@requires: 'authenticated-user'</text><text x="24" y="276" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s -o /dev/null -w '%{http_code}\n' -u alice: http://localhost:4004/odata/v4/book-order/$metadata</text><text x="24" y="296" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">200</text><text x="24" y="336" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ # 步骤③：注解是否真的进了 $metadata（对应「页面有列名但没有列」）</text><text x="24" y="356" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s -u alice: http://localhost:4004/odata/v4/book-order/$metadata | grep -c 'UI.LineItem'</text><text x="24" y="376" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">2                        # 订单头 + 明细各一份；是 0 就说明 annotations.cds 没被加载</text><text x="24" y="396" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s -u alice: http://localhost:4004/odata/v4/book-order/$metadata | grep -A2 'Criticality'</text><text x="24" y="416" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">&lt;PropertyValue Property=&quot;Criticality&quot; Path=&quot;statusCriticality&quot;/&gt;</text><text x="24" y="456" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ # 顺带一句：app/ 目录是静态发布的，注解文件本身也能被直接下载</text><text x="24" y="476" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s -o /dev/null -w '%{http_code}\n' http://localhost:4004/book-orders/annotations.cds</text><text x="24" y="496" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">200</text><path d="M720.0 161.9 L129.0 93.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="707" y="148.875" width="143.68" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="720" cy="161.875" r="10" fill="#aa0808"/><text x="720" y="165.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">1</text><text x="736" y="166.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">1. 入口页必须 200</text><path d="M891.2 173.9 L300.2 173.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="878.25" y="160.875" width="112.96" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="891.25" cy="173.875" r="10" fill="#aa0808"/><text x="891.25" y="177.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">2</text><text x="907.25" y="178.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">2. 目录≠入口</text><path d="M841.2 353.9 L380.2 353.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="828.25" y="340.875" width="142.72" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="841.25" cy="353.875" r="10" fill="#aa0808"/><text x="841.25" y="357.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">3</text><text x="857.25" y="358.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">3. 注解没进元数据</text><path d="M855.0 413.9 L264.0 413.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="842" y="400.875" width="142.72" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="855" cy="413.875" r="10" fill="#aa0808"/><text x="855" y="417.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">4</text><text x="871" y="418.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">4. 着色靠这个路径</text></svg>