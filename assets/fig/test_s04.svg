<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img"><rect x="0" y="0" width="1440" height="900" fill="#f5f6f7"/><rect x="0" y="0" width="1440" height="34" fill="#252526"/><circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="38" cy="17" r="6" fill="#ffbd2e"/><circle cx="56" cy="17" r="6" fill="#27c93f"/><text x="720" y="21.5" font-size="12.5" fill="#c8c8c8" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">jason@MacBook-Pro: ~/projects/demo-node — 三个真实的「测试跑不起来」</text><rect x="0" y="34" width="1440" height="866" fill="#1b1b1b"/><text x="24" y="56" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ npm test                                  # 项目里还没有 test/*.test.js 时</text><text x="24" y="75" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">&gt; mocha --reporter spec --timeout 20000 test/*.test.js</text><text x="24" y="94" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Error: No test files found: &quot;test/*.test.js&quot;</text><text x="24" y="132" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ npx cds test -?                           # @cap-js/cds-test 未安装时</text><text x="24" y="151" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Error: Cannot find module '@cap-js/cds-test/bin/chest.js'</text><text x="24" y="189" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ npm i -D @cap-js/cds-test                 # 直接装会被 peer 依赖挡住</text><text x="24" y="208" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">npm error code ERESOLVE</text><text x="24" y="227" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">npm error Found: chai@5.3.3</text><text x="24" y="246" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">npm error   dev chai@&quot;^5&quot; from the root project</text><text x="24" y="265" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">npm error Could not resolve dependency:</text><text x="24" y="284" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">npm error peer chai@&quot;^6&quot; from @cap-js/cds-test@1.0.2</text><text x="24" y="322" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ npm i -D @cap-js/cds-test --legacy-peer-deps     # 或把 chai 升到 ^6 后重装</text><text x="24" y="341" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ npx mocha --reporter spec --timeout 20000 test/*.test.js</text><text x="24" y="360" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  16 passing (425ms)</text><text x="24" y="398" font-size="12.5" fill="#e3d18a" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace"> 不想引入 cds-test 也可以用项目自带的 bash 脚本作为集成测试：</text><text x="24" y="417" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ bash test/odata-verify.sh   # → PASS 26 / FAIL 0（见上一张画面）</text><path d="M530.0 91.9 L189.0 91.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="517" y="78.875" width="178.72" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="530" cy="91.875" r="10" fill="#aa0808"/><text x="530" y="95.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">1</text><text x="546" y="96.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">1. 脚本存在但文件不存在</text><path d="M578.8 148.9 L237.8 148.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="565.75" y="135.875" width="186.88" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="578.75" cy="148.875" r="10" fill="#aa0808"/><text x="578.75" y="152.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">2</text><text x="594.75" y="153.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">2. cds.test 需要单独装包</text><path d="M440.0 281.9 L219.0 281.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="427" y="268.875" width="173.92" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="440" cy="281.875" r="10" fill="#aa0808"/><text x="440" y="285.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">3</text><text x="456" y="286.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">3. chai 版本是常见卡点</text><path d="M560.0 357.9 L99.0 357.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="547" y="344.875" width="190.72" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="560" cy="357.875" r="10" fill="#aa0808"/><text x="560" y="361.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">4</text><text x="576" y="362.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">4. 装上之后同一命令即通过</text><path d="M605.0 414.9 L264.0 414.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="592" y="401.875" width="166.72" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="605" cy="414.875" r="10" fill="#aa0808"/><text x="605" y="418.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">5</text><text x="621" y="419.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">5. 不装包也有兜底方案</text></svg>