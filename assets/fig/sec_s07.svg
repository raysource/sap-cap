<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img"><rect x="0" y="0" width="1440" height="900" fill="#f5f6f7"/><rect x="0" y="0" width="1440" height="34" fill="#252526"/><circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="38" cy="17" r="6" fill="#ffbd2e"/><circle cx="56" cy="17" r="6" fill="#27c93f"/><text x="720" y="21.5" font-size="12.5" fill="#c8c8c8" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">jason@MacBook-Pro: ~/sap-cap — 从模型生成 XSUAA 描述符</text><rect x="0" y="34" width="1440" height="866" fill="#1b1b1b"/><text x="24" y="56" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ npx cds compile srv --to xsuaa     # 示范项目原样（只写 authenticated-user）</text><text x="24" y="75" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">{</text><text x="24" y="94" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  &quot;scopes&quot;: [],</text><text x="24" y="113" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  &quot;attributes&quot;: [],</text><text x="24" y="132" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  &quot;role-templates&quot;: []</text><text x="24" y="151" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">}</text><text x="24" y="189" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ npx cds compile srv --to xsuaa     # 加了 to: 'view' / 'edit' / 'submit' 之后</text><text x="24" y="208" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">{</text><text x="24" y="227" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  &quot;scopes&quot;: [</text><text x="24" y="246" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">    { &quot;name&quot;: &quot;$XSAPPNAME.view&quot;,   &quot;description&quot;: &quot;view&quot; },</text><text x="24" y="265" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">    { &quot;name&quot;: &quot;$XSAPPNAME.edit&quot;,   &quot;description&quot;: &quot;edit&quot; },</text><text x="24" y="284" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">    { &quot;name&quot;: &quot;$XSAPPNAME.submit&quot;, &quot;description&quot;: &quot;submit&quot; }</text><text x="24" y="303" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  ],</text><text x="24" y="322" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  &quot;attributes&quot;: [],</text><text x="24" y="341" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  &quot;role-templates&quot;: [</text><text x="24" y="360" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">    { &quot;name&quot;: &quot;view&quot;,   &quot;description&quot;: &quot;generated&quot;,</text><text x="24" y="379" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">      &quot;scope-references&quot;: [ &quot;$XSAPPNAME.view&quot; ], &quot;attribute-references&quot;: [] },</text><text x="24" y="398" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">    ...</text><text x="24" y="417" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  ]</text><text x="24" y="436" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">}</text><text x="24" y="474" font-size="12.5" fill="#e3d18a" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace"> 结论：模型里的 to: 名 → scope 名（加前缀）；role-template 名由你决定（生成的是 to: 名）</text><text x="24" y="493" font-size="12.5" fill="#e3d18a" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace"> 示范项目把 role-templates 改成了 OrderViewer / OrderEditor / OrderAdmin —— scope 引用不变</text><text x="24" y="512" font-size="12.5" fill="#e3d18a" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace"> 同一目标重复 annotate @restrict 时只有 [WARNING]，后者会把前者整体覆盖</text><path d="M161.0 660.0 L60.0 660.0" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="148" y="647" width="163.36" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="161" cy="660" r="10" fill="#aa0808"/><text x="161" y="664" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">1</text><text x="177" y="664.5" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">1. 没写 to: 无 scope</text><path d="M161.0 696.0 L60.0 696.0" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="148" y="683" width="157.6" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="161" cy="696" r="10" fill="#aa0808"/><text x="161" y="700" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">2</text><text x="177" y="700.5" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">2. to: → 一个 scope</text><path d="M161.0 732.0 L60.0 732.0" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="148" y="719" width="142.72" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="161" cy="732" r="10" fill="#aa0808"/><text x="161" y="736" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">3</text><text x="177" y="736.5" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">3. 模板名可自己起</text><path d="M161.0 768.0 L60.0 768.0" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="148" y="755" width="142.72" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="161" cy="768" r="10" fill="#aa0808"/><text x="161" y="772" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">4</text><text x="177" y="772.5" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">4. 重复注解会覆盖</text></svg>