<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img"><rect x="0" y="0" width="1440" height="900" fill="#f5f6f7"/><rect x="0" y="0" width="1440" height="34" fill="#252526"/><circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="38" cy="17" r="6" fill="#ffbd2e"/><circle cx="56" cy="17" r="6" fill="#27c93f"/><text x="720" y="21.5" font-size="12.5" fill="#c8c8c8" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">jason@MacBook-Pro: ~/projects/demo-node — bash test/odata-verify.sh</text><rect x="0" y="34" width="1440" height="866" fill="#1b1b1b"/><text x="24" y="56" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">== 1. 服务可达性与认证 ==</text><text x="24" y="74" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  PASS  GET $metadata (alice)                                      200</text><text x="24" y="92" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  PASS  GET /BookOrders 匿名 → 401                             401</text><text x="24" y="110" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  PASS  GET /BookOrders (bob)                                      200</text><text x="24" y="128" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  PASS  GET /BookOrders 任意用户(mocked 放行)                200</text><text x="24" y="146" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">== 2. 读：过滤 / 展开 / 只读视图 ==</text><text x="24" y="164" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  PASS  GET BookOrders?$filter=status eq OPEN → 2 张            2</text><text x="24" y="182" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  PASS  GET BookOrders 带 $expand=items 行数                    3</text><text x="24" y="200" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  PASS  GET OrderItemView (带主键视图，可暴露)              9</text><text x="24" y="218" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  PASS  GET OrderItemView 含关联展开的列名                 BO-1001</text><text x="24" y="236" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">== 3. 函数（无绑定）：聚合走函数而不是实体 ==</text><text x="24" y="254" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  PASS  getOrderTotal(BO-1003) = 17400                             17400</text><text x="24" y="272" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  PASS  getOrderTotal(不存在) → 404                           404</text><text x="24" y="290" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  PASS  getOrderSummary() 4 行                                    4</text><text x="24" y="308" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  PASS  getOrderSummary() BO-1001 合计                           16000</text><text x="24" y="326" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">== 4. 写：派生字段与汇总回写 ==</text><text x="24" y="344" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  PASS  POST 明细：金额自动计算 = 2800×3                 8400</text><text x="24" y="362" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  PASS  POST 明细后父订单合计被回写 = 12000             12000</text><text x="24" y="380" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">== 5. 负向：业务校验必须返回 4xx 且带消息 ==</text><text x="24" y="398" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  PASS  POST 数量 0 → 400                                      400</text><text x="24" y="416" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  PASS  POST 图书不存在 → 400                               400</text><text x="24" y="434" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  PASS  只读实体 POST → 405                                  405</text><text x="24" y="452" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">== 6. 草稿（@odata.draft.enabled）创建与激活 ==</text><text x="24" y="470" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  PASS  POST 新建订单 → 草稿未激活                      False</text><text x="24" y="488" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  PASS  重复订单号激活 → 409                              409</text><text x="24" y="506" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  PASS  顾客不存在激活 → 400                              400</text><text x="24" y="524" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  PASS  正常激活 → 201 并自动编号                       201</text><text x="24" y="542" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  PASS  自动编号 = BO-1005                                     BO-1005</text><text x="24" y="560" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">== 7. 绑定动作 submitOrder（状态迁移） ==</text><text x="24" y="578" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  PASS  空订单提交 → 400                                    400</text><text x="24" y="596" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  PASS  BO-1001 提交 → 200                                     200</text><text x="24" y="614" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  PASS  状态已变为 SUBMITTED                                  SUBMITTED</text><text x="24" y="632" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  PASS  重复提交 → 409                                       409</text><text x="24" y="668" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">==================== 结果 ====================</text><text x="24" y="686" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  PASS 26 / FAIL 0</text><path d="M597.5 125.9 L256.5 125.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="584.5" y="112.875" width="198.4" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="597.5" cy="125.875" r="10" fill="#aa0808"/><text x="597.5" y="129.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">1</text><text x="613.5" y="130.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">1. mocked 认证放行任意用户</text><path d="M580.0 359.9 L239.0 359.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="567" y="346.875" width="216.64" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="580" cy="359.875" r="10" fill="#aa0808"/><text x="580" y="363.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">2</text><text x="596" y="364.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">2. 一次写请求验证两个 handler</text><path d="M622.5 539.9 L281.5 539.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="609.5" y="526.875" width="166.72" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="622.5" cy="539.875" r="10" fill="#aa0808"/><text x="622.5" y="543.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">3</text><text x="638.5" y="544.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">3. 断言落到具体业务值</text><path d="M435.0 683.9 L94.0 683.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="422" y="670.875" width="277.6" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="435" cy="683.875" r="10" fill="#aa0808"/><text x="435" y="687.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">4</text><text x="451" y="688.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">4. FAIL&gt;0 时脚本以非 0 退出（可进 CI）</text></svg>