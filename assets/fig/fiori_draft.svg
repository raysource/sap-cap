<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img"><rect x="0" y="0" width="1440" height="900" fill="#f5f6f7"/><rect x="0" y="0" width="1440" height="34" fill="#252526"/><circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="38" cy="17" r="6" fill="#ffbd2e"/><circle cx="56" cy="17" r="6" fill="#27c93f"/><text x="720" y="21.5" font-size="12.5" fill="#c8c8c8" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">jason@MacBook-Pro: ~/projects/demo-node — Fiori 保存按钮背后的真实请求</text><rect x="0" y="34" width="1440" height="866" fill="#1b1b1b"/><text x="24" y="56" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ SVC=http://localhost:4004/odata/v4/book-order   # 请求由 Fiori 发出，这里用 curl 复现</text><text x="24" y="96" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ # ① Create：POST 建草稿（返回的 ID 是草稿 ID，orderNo 仍是传入值）</text><text x="24" y="116" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s -u alice: -X POST &quot;$SVC/BookOrders&quot; -H 'Content-Type: application/json' \</text><text x="24" y="136" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">    -d '{&quot;orderNo&quot;:&quot;BO-1099&quot;,&quot;customer_ID&quot;:1000,&quot;note&quot;:&quot;from Fiori&quot;}'</text><text x="24" y="156" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">{&quot;@odata.context&quot;:&quot;$metadata#BookOrders/$entity&quot;,&quot;ID&quot;:&quot;d8f19656-dda7-436c-85d9-70cde2cbf21b&quot;,</text><text x="24" y="176" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace"> &quot;orderNo&quot;:&quot;BO-1099&quot;,&quot;customer_ID&quot;:1000,&quot;orderDate&quot;:&quot;2026-09-19&quot;,&quot;status&quot;:&quot;OPEN&quot;,</text><text x="24" y="196" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace"> &quot;totalAmount&quot;:0,&quot;IsActiveEntity&quot;:false}</text><text x="24" y="236" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ # ② 编辑明细/字段：PATCH 草稿行（Fiori 每改一个字段发一次）</text><text x="24" y="256" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s -u alice: -X PATCH &quot;$SVC/BookOrders(ID=$ID,IsActiveEntity=false)&quot; \</text><text x="24" y="276" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">    -H 'Content-Type: application/json' -d '{&quot;note&quot;:&quot;edited in draft&quot;}' -o /dev/null -w 'HTTP %{http_code}\n'</text><text x="24" y="296" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">HTTP 200</text><text x="24" y="336" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ # ③ Save：POST draftActivate —— 这时才写正式表、才触发 before('CREATE')</text><text x="24" y="356" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s -u alice: -X POST &quot;$SVC/BookOrders(ID=$ID,IsActiveEntity=false)/draftActivate&quot; \</text><text x="24" y="376" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">    -H 'Content-Type: application/json' -o /tmp/act.json -w 'HTTP %{http_code}\n'</text><text x="24" y="396" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">HTTP 201</text><text x="24" y="416" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">{&quot;@odata.context&quot;:&quot;../$metadata#BookOrders/$entity&quot;,&quot;orderNo&quot;:&quot;BO-1099&quot;,&quot;note&quot;:&quot;edited in draft&quot;,</text><text x="24" y="436" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace"> &quot;totalAmount&quot;:0,&quot;statusCriticality&quot;:1,&quot;HasActiveEntity&quot;:false,&quot;IsActiveEntity&quot;:true}</text><text x="24" y="476" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ # ④ 业务校验在激活时返回 4xx（草稿阶段不拦，方便用户慢慢改）</text><text x="24" y="496" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">{&quot;error&quot;:{&quot;message&quot;:&quot;顾客 9999 不存在，请先维护主数据&quot;,&quot;code&quot;:&quot;400&quot;,&quot;@Common.numericSeverity&quot;:4}}</text><text x="24" y="516" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">{&quot;error&quot;:{&quot;message&quot;:&quot;订单号 BO-1001 已存在，请更换&quot;,&quot;code&quot;:&quot;409&quot;,&quot;@Common.numericSeverity&quot;:4}}</text><text x="24" y="556" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ # ⑤ 取消：DELETE 草稿行（Fiori 的「取消」按钮）</text><text x="24" y="576" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s -u alice: -X DELETE &quot;$SVC/BookOrders(ID=$ID,IsActiveEntity=false)&quot; -w 'HTTP %{http_code}\n'</text><text x="24" y="596" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">HTTP 204</text><path d="M765.0 193.9 L174.0 193.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="752" y="180.875" width="106.72" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="765" cy="193.875" r="10" fill="#aa0808"/><text x="765" y="197.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">1</text><text x="781" y="198.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">1. 只是草稿</text><path d="M645.0 327.9 L54.0 293.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="632" y="314.875" width="154.72" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="645" cy="327.875" r="10" fill="#aa0808"/><text x="645" y="331.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">2</text><text x="661" y="332.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">2. 每次改动一个请求</text><path d="M805.0 393.9 L54.0 393.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="792" y="380.875" width="112.96" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="805" cy="393.875" r="10" fill="#aa0808"/><text x="805" y="397.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">3</text><text x="821" y="398.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">3. 保存=激活</text><path d="M832.5 493.9 L371.5 493.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="819.5" y="480.875" width="154.72" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="832.5" cy="493.875" r="10" fill="#aa0808"/><text x="832.5" y="497.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">4</text><text x="848.5" y="498.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">4. 校验在保存时才拦</text></svg>