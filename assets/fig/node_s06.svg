<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img"><rect x="0" y="0" width="1440" height="900" fill="#f5f6f7"/><rect x="0" y="0" width="1440" height="34" fill="#252526"/><circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="38" cy="17" r="6" fill="#ffbd2e"/><circle cx="56" cy="17" r="6" fill="#27c93f"/><text x="720" y="21.5" font-size="12.5" fill="#c8c8c8" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">jason@MacBook-Pro: ~/projects/demo-node — 草稿与绑定动作实测</text><rect x="0" y="34" width="1440" height="866" fill="#1b1b1b"/><text x="24" y="56" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ SVC=http://localhost:4004/odata/v4/book-order ; A='-u alice:alice'</text><text x="24" y="75" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s $A -X POST &quot;$SVC/BookOrders&quot; -H 'Content-Type: application/json' -d '{&quot;customer_ID&quot;:1000}'</text><text x="24" y="94" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">{&quot;@odata.context&quot;:&quot;$metadata#BookOrders/$entity&quot;,&quot;createdAt&quot;:&quot;2026-09-19T11:47:50.261Z&quot;,&quot;createdBy&quot;:&quot;alice&quot;,</text><text x="24" y="113" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace"> &quot;ID&quot;:&quot;33f68968-b47b-4e2f-9473-120e0425e080&quot;,&quot;orderNo&quot;:null,&quot;customer_ID&quot;:1000,&quot;orderDate&quot;:&quot;2026-09-19&quot;,</text><text x="24" y="132" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace"> &quot;status&quot;:&quot;OPEN&quot;,&quot;totalAmount&quot;:0,&quot;HasActiveEntity&quot;:false,&quot;IsActiveEntity&quot;:false}</text><text x="24" y="151" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ ID=33f68968-b47b-4e2f-9473-120e0425e080</text><text x="24" y="170" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s -w 'HTTP %{http_code}' $A -X POST &quot;$SVC/BookOrders(ID=$ID,IsActiveEntity=false)/BookOrderService.draftActivate&quot; -d '{}'</text><text x="24" y="189" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">HTTP 201</text><text x="24" y="208" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">{&quot;@odata.context&quot;:&quot;../$metadata#BookOrders/$entity&quot;,&quot;ID&quot;:&quot;33f68968-b47b-4e2f-9473-120e0425e080&quot;,</text><text x="24" y="227" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace"> &quot;orderNo&quot;:&quot;BO-1005&quot;,&quot;customer_ID&quot;:1000,&quot;orderDate&quot;:&quot;2026-09-19&quot;,&quot;status&quot;:&quot;OPEN&quot;,&quot;totalAmount&quot;:0,&quot;IsActiveEntity&quot;:true}</text><text x="24" y="265" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s -w 'HTTP %{http_code}' $A -X POST &quot;$SVC/BookOrders(ID=4a1f8c03-0001-…,IsActiveEntity=true)/submitOrder&quot; -d '{}'</text><text x="24" y="284" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">HTTP 200</text><text x="24" y="303" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">{&quot;@odata.context&quot;:&quot;../$metadata#Edm.String&quot;,&quot;value&quot;:&quot;订单 BO-1001 已提交，合计 16000.00 JPY（3 行）&quot;}</text><text x="24" y="341" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s -w 'HTTP %{http_code}' $A -X POST &quot;$SVC/BookOrders(ID=4a1f8c03-0003-…,IsActiveEntity=true)/submitOrder&quot; -d '{}'</text><text x="24" y="360" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">HTTP 409</text><text x="24" y="379" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">{&quot;error&quot;:{&quot;message&quot;:&quot;订单 BO-1003 当前状态为 SUBMITTED，不能重复提交&quot;,&quot;code&quot;:&quot;409&quot;,&quot;@Common.numericSeverity&quot;:4}}</text><text x="24" y="417" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s -w 'HTTP %{http_code}' $A -X POST &quot;$SVC/BookOrders(ID=c64c5095-…,IsActiveEntity=true)/submitOrder&quot; -d '{}'</text><text x="24" y="436" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">HTTP 400</text><text x="24" y="455" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">{&quot;error&quot;:{&quot;message&quot;:&quot;订单 BO-1005 没有明细，不能提交&quot;,&quot;code&quot;:&quot;400&quot;,&quot;@Common.numericSeverity&quot;:4}}</text><path d="M915.0 129.9 L324.0 129.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="902" y="116.875" width="224.8" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="915" cy="129.875" r="10" fill="#aa0808"/><text x="915" y="133.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">1</text><text x="931" y="134.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">1. POST 只建草稿：orderNo=null</text><path d="M931.2 224.9 L470.2 224.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="918.25" y="211.875" width="269.92" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="931.25" cy="224.875" r="10" fill="#aa0808"/><text x="931.25" y="228.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">2</text><text x="947.25" y="229.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">2. draftActivate → before-CREATE 编号</text><path d="M850.0 300.9 L389.0 300.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="837" y="287.875" width="216.16" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="850" cy="300.875" r="10" fill="#aa0808"/><text x="850" y="304.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">3</text><text x="866" y="305.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">3. 动作返回字符串直接进 value</text><path d="M887.5 376.9 L426.5 376.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="874.5" y="363.875" width="144.16" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="887.5" cy="376.875" r="10" fill="#aa0808"/><text x="887.5" y="380.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">4</text><text x="903.5" y="381.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">4. 重复提交 → 409</text><path d="M831.2 452.9 L370.2 452.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="818.25" y="439.875" width="204.16" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="831.25" cy="452.875" r="10" fill="#aa0808"/><text x="831.25" y="456.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">5</text><text x="847.25" y="457.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">5. 业务前置条件不满足 → 400</text></svg>