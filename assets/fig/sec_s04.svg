<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img"><rect x="0" y="0" width="1440" height="900" fill="#f5f6f7"/><rect x="0" y="0" width="1440" height="34" fill="#252526"/><circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="38" cy="17" r="6" fill="#ffbd2e"/><circle cx="56" cy="17" r="6" fill="#27c93f"/><text x="720" y="21.5" font-size="12.5" fill="#c8c8c8" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">jason@MacBook-Pro: ~/sap-cap/project-code/demo-node — kind = dummy</text><rect x="0" y="34" width="1440" height="866" fill="#1b1b1b"/><text x="24" y="56" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ cds_requires_auth_kind=dummy npx cds-serve --port 4124</text><text x="24" y="76" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">[cds] - using auth strategy { kind: 'dummy' }</text><text x="24" y="96" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">[cds] - serving BookOrderService { at: '/odata/v4/book-order' }</text><text x="24" y="116" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s -o /dev/null -w '%{http_code}\n' localhost:4124/odata/v4/book-order/BookOrders</text><text x="24" y="136" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">200</text><text x="24" y="156" font-size="12.5" fill="#e3d18a" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace"> 匿名请求也是 200：dummy 把每个请求都当成特权用户（cds.User.privileged）</text><text x="24" y="176" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s -u anybody:whatever -o /dev/null -w '%{http_code}\n' localhost:4124/odata/v4/book-order/BookOrders</text><text x="24" y="196" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">200</text><text x="24" y="216" font-size="12.5" fill="#e3d18a" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace"> @requires / @restrict 全部被绕过 —— 这是「临时关掉权限」的策略，不是认证</text><text x="24" y="256" font-size="12.5" fill="#e3d18a" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace"> 正确姿势：本地验证 401 用 mocked，验证业务逻辑用 dummy 只限临时排障</text><path d="M161.0 620.0 L60.0 620.0" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="148" y="607" width="150.4" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="161" cy="620" r="10" fill="#aa0808"/><text x="161" y="624" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">1</text><text x="177" y="624.5" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">1. 匿名 200 = 陷阱</text><path d="M161.0 656.0 L60.0 656.0" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="148" y="643" width="156.16" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="161" cy="656" r="10" fill="#aa0808"/><text x="161" y="660" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">2</text><text x="177" y="660.5" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">2. dummy 是特权用户</text><path d="M161.0 692.0 L60.0 692.0" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="148" y="679" width="154.72" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="161" cy="692" r="10" fill="#aa0808"/><text x="161" y="696" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">3</text><text x="177" y="696.5" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">3. 注解只会静默失效</text></svg>