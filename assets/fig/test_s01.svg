<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img"><rect x="0" y="0" width="1440" height="900" fill="#f5f6f7"/><rect x="0" y="0" width="1440" height="34" fill="#252526"/><circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="38" cy="17" r="6" fill="#ffbd2e"/><circle cx="56" cy="17" r="6" fill="#27c93f"/><text x="720" y="21.5" font-size="12.5" fill="#c8c8c8" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">jason@MacBook-Pro: ~/projects/demo-node — npm test（mocha + cds.test）</text><rect x="0" y="34" width="1440" height="866" fill="#1b1b1b"/><text x="24" y="56" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ npm test</text><text x="24" y="94" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">&gt; demo-node@1.0.0 test</text><text x="24" y="113" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">&gt; mocha --reporter spec --timeout 20000 test/*.test.js</text><text x="24" y="151" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  图书受注服务 —— OData 集成测试（mocha + cds.test）</text><text x="24" y="170" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">    ✔ ① GET $metadata → 200，且暴露 BookOrderService.BookOrders (61ms)</text><text x="24" y="189" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">    ✔ ② 匿名（无 Basic Auth）→ 401</text><text x="24" y="208" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">    ✔ ③ 过滤 status eq OPEN → 2 张（BO-1001 / BO-1002）</text><text x="24" y="227" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">    ✔ ④ $expand=items → BO-1001 有 3 行明细</text><text x="24" y="246" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">    ✔ ⑤ 只读视图 OrderItemView → 9 行，首行 orderNo=BO-1001</text><text x="24" y="265" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">    ✔ ⑥ 函数 getOrderTotal(BO-1003) → 17400</text><text x="24" y="284" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">    ✔ ⑦ 函数 getOrderSummary() → 4 行，BO-1001 合计 16000</text><text x="24" y="303" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">    ✔ ⑧ 派生字段：POST 明细 2800×3 → amount 8400，父订单合计回写 12000</text><text x="24" y="322" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">    ✔ ⑨ 负向：数量 0 → 400 且带业务消息</text><text x="24" y="341" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">    ✔ ⑩ 负向：图书 9999 不存在 → 400</text><text x="24" y="360" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">    ✔ ⑪ 负向：只读实体 POST → 405</text><text x="24" y="379" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">    ✔ ⑫ 草稿：POST 新建订单 → IsActiveEntity=false（未激活）</text><text x="24" y="398" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">    ✔ ⑬ 草稿：draftActivate → 201，触发 before-CREATE 自动编号</text><text x="24" y="417" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">    ✔ ⑭ 绑定动作：空订单提交 → 400</text><text x="24" y="436" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">    ✔ ⑮ 绑定动作：BO-1001 提交 → 200，状态迁移为 SUBMITTED</text><text x="24" y="455" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">    ✔ ⑯ 绑定动作：重复提交同一张订单 → 409</text><text x="24" y="512" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  16 passing (425ms)</text><path d="M447.5 110.9 L226.5 110.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="434.5" y="97.875" width="267.52" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="447.5" cy="110.875" r="10" fill="#aa0808"/><text x="447.5" y="114.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">1</text><text x="463.5" y="115.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">1. 命令来自 package.json 的 test 脚本</text><path d="M608.8 300.9 L267.8 300.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="595.75" y="287.875" width="216.64" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="608.75" cy="300.875" r="10" fill="#aa0808"/><text x="608.75" y="304.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">2</text><text x="624.75" y="305.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">2. 一个用例同时验两个 handler</text><path d="M585.0 395.9 L244.0 395.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="572" y="382.875" width="154.72" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="585" cy="395.875" r="10" fill="#aa0808"/><text x="585" y="399.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">3</text><text x="601" y="400.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">3. 草稿必须写进测试</text><path d="M200.0 509.9 L99.0 509.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="187" y="496.875" width="154.72" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="200" cy="509.875" r="10" fill="#aa0808"/><text x="200" y="513.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">4</text><text x="216" y="514.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">4. 全绿不等于全覆盖</text></svg>