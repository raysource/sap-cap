<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img"><rect x="0" y="0" width="1440" height="900" fill="#f5f6f7"/><rect x="0" y="0" width="1440" height="34" fill="#252526"/><circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="38" cy="17" r="6" fill="#ffbd2e"/><circle cx="56" cy="17" r="6" fill="#27c93f"/><text x="720" y="21.5" font-size="12.5" fill="#c8c8c8" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">jason@MacBook-Pro: ~/projects/demo-node</text><rect x="0" y="34" width="1440" height="866" fill="#1b1b1b"/><text x="24" y="56" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ cds bind db --to demo-hana-db</text><text x="24" y="74.5" font-size="12.5" fill="#79c0ff" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">[bind] - Retrieving data from Cloud Foundry...</text><text x="24" y="93" font-size="12.5" fill="#79c0ff" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">[bind] - Binding db to Cloud Foundry managed service demo-hana-db:demo-hana-db-key with kind hana.</text><text x="24" y="111.5" font-size="12.5" fill="#79c0ff" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">[bind] - Saving bindings to .cdsrc-private.json in profile hybrid.</text><text x="24" y="130" font-size="12.5" fill="#79c0ff" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">[bind] -</text><text x="24" y="148.5" font-size="12.5" fill="#79c0ff" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">[bind] - TIP: Run with cloud bindings: cds watch --profile hybrid</text><text x="24" y="185.5" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ cds watch --profile hybrid</text><text x="24" y="204" font-size="12.5" fill="#79c0ff" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">[cds] - connect to db &gt; hana { url: '...hana.ondemand.com:443' }</text><text x="24" y="222.5" font-size="12.5" fill="#79c0ff" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">[cds] - serving BookOrderService { at: [ '/odata/v4/book-order' ] }</text><text x="24" y="241" font-size="12.5" fill="#79c0ff" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">[cds] - server listening on { url: 'http://localhost:4004' }</text><text x="24" y="278" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ cds env get requires.db --profile hybrid</text><text x="24" y="296.5" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  { &quot;kind&quot;: &quot;hana&quot;, &quot;binding&quot;: { &quot;type&quot;: &quot;cf&quot;, &quot;instance&quot;: &quot;demo-hana-db&quot; } }</text><text x="24" y="333.5" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ cds bind --exec --profile hybrid -- npm run integration-test</text><text x="24" y="352" font-size="12.5" fill="#e3d18a" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  等价做法：把凭据以 VCAP_SERVICES 注入子进程，不写任何文件</text><path d="M891.2 87.9 L140.2 53.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="878.25" y="74.875" width="216.64" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="891.25" cy="87.875" r="10" fill="#aa0808"/><text x="891.25" y="91.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">1</text><text x="907.25" y="92.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">1. 绑定 CF 上的 HDI 容器实例</text><path d="M612.5 143.4 L271.5 109.4" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="599.5" y="130.375" width="178.72" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="612.5" cy="143.375" r="10" fill="#aa0808"/><text x="612.5" y="147.375" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">2</text><text x="628.5" y="147.875" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">2. 只存「去哪里取凭据」</text><path d="M590.0 183.4 L129.0 183.4" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="577" y="170.375" width="154.72" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="590" cy="183.375" r="10" fill="#aa0808"/><text x="590" y="187.375" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">3</text><text x="606" y="187.875" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">3. 本地进程连云端库</text><path d="M597.5 331.4 L256.5 331.4" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="584.5" y="318.375" width="204.64" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="597.5" cy="331.375" r="10" fill="#aa0808"/><text x="597.5" y="335.375" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">4</text><text x="613.5" y="335.875" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">4. 测试场景用 --exec 更干净</text></svg>