<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img"><rect x="0" y="0" width="1440" height="900" fill="#f5f6f7"/><rect x="0" y="0" width="1440" height="34" fill="#252526"/><circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="38" cy="17" r="6" fill="#ffbd2e"/><circle cx="56" cy="17" r="6" fill="#27c93f"/><text x="720" y="21.5" font-size="12.5" fill="#c8c8c8" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">jason@MacBook-Pro: ~/projects — 部署后验证清单（逐条 curl）</text><rect x="0" y="34" width="1440" height="866" fill="#1b1b1b"/><text x="24" y="56" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ R=https://trial-dev-demo-node.cfapps.ap10.hana.ondemand.com</text><text x="24" y="96" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s -o /dev/null -w '%{http_code}\n' $R/odata/v4/book-order/$metadata</text><text x="24" y="116" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">200                                   # ① 服务活着且元数据可序列化</text><text x="24" y="156" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s -u alice: &quot;$R/odata/v4/book-order/BookOrders?\$select=orderNo,status,totalAmount&quot; -G \</text><text x="24" y="176" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">    --data-urlencode '\$top=2'</text><text x="24" y="196" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">{&quot;@odata.context&quot;:&quot;$metadata#BookOrders&quot;,&quot;value&quot;:[{&quot;orderNo&quot;:&quot;BO-1001&quot;,&quot;status&quot;:&quot;OPEN&quot;,</text><text x="24" y="216" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace"> &quot;totalAmount&quot;:16000},{&quot;orderNo&quot;:&quot;BO-1002&quot;,&quot;status&quot;:&quot;OPEN&quot;,&quot;totalAmount&quot;:3600}]}    # ② 数据在</text><text x="24" y="256" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ cf apps</text><text x="24" y="276" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">name                 requested state   processes   routes</text><text x="24" y="296" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">demo-node-srv        started           web:1/1     trial-dev-demo-node-srv.cfapps.ap10…</text><text x="24" y="316" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">demo-node            started           web:1/1     trial-dev-demo-node.cfapps.ap10…</text><text x="24" y="356" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ cf logs demo-node-srv --recent | tail -4</text><text x="24" y="376" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  [APP/PROC/WEB/0] OUT [cds] - serving BookOrderService { at: '/odata/v4/book-order' }</text><text x="24" y="396" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  [APP/PROC/WEB/0] OUT [cds] - using HANA from service demo-node-db</text><text x="24" y="416" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  [APP/PROC/WEB/0] OUT Server listening on port 8080          # ③ ④ 应用起来了、用的是 HANA</text><text x="24" y="456" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s -o /dev/null -w '%{http_code}\n' $R/</text><text x="24" y="476" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">200                                   # ⑤ approuter 首页（未登录会先跳登录页）</text><path d="M597.5 113.9 L256.5 113.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="584.5" y="100.875" width="170.08" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="597.5" cy="113.875" r="10" fill="#aa0808"/><text x="597.5" y="117.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">1</text><text x="613.5" y="118.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">1. $metadata 必须 200</text><path d="M833.8 213.9 L372.8 213.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="820.75" y="200.875" width="149.92" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="833.75" cy="213.875" r="10" fill="#aa0808"/><text x="833.75" y="217.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">2</text><text x="849.75" y="218.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">2. 数据与 CSV 一致</text><path d="M738.8 393.9 L277.8 393.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="725.75" y="380.875" width="149.92" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="738.75" cy="393.875" r="10" fill="#aa0808"/><text x="738.75" y="397.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">3</text><text x="754.75" y="398.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">3. 确认连的是 HANA</text><path d="M796.2 313.9 L335.2 313.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="783.25" y="300.875" width="175.84" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="796.25" cy="313.875" r="10" fill="#aa0808"/><text x="796.25" y="317.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">4</text><text x="812.25" y="318.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">4. UI 入口是 approuter</text></svg>