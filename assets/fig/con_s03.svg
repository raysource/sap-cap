e3d18a" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace"> 换方言：npx cds compile db/schema.cds --to hana | --to postgres</text><path d="M161.0 560.0 L60.0 560.0" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="148" y="547" width="173.44" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="161" cy="560" r="10" fill="#aa0808"/><text x="161" y="564" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">1</text><text x="177" y="564.5" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">1. 命名空间 → 表名前缀</text><path d="M161.0 596.0 L60.0 596.0" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="148" y="583" width="144.64" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="161" cy="596" r="10" fill="#aa0808"/><text x="161" y="600" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">2</text><text x="177" y="600.5" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">2. managed 补四列</text><path d="M161.0 632.0 L60.0 632.0" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="148" y="619" width="187.84" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="161" cy="632" r="10" fill="#aa0808"/><text x="161" y="636" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">3</text><text x="177" y="636.5" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">3. 换 target 换 SQL 方言</text></svg>