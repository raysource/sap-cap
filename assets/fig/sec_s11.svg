<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img"><rect x="0" y="0" width="1440" height="900" fill="#f5f6f7"/><rect x="0" y="0" width="1440" height="34" fill="#252526"/><circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="38" cy="17" r="6" fill="#ffbd2e"/><circle cx="56" cy="17" r="6" fill="#27c93f"/><text x="720" y="21.5" font-size="12.5" fill="#c8c8c8" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">jason@MacBook-Pro: ~/sap-cap — 部署后取 JWT 并访问受保护资源</text><rect x="0" y="34" width="1440" height="866" fill="#1b1b1b"/><text x="24" y="56" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ cf create-service-key demo-node-uaa demo-key</text><text x="24" y="75" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">Creating service key demo-key for service instance demo-node-uaa as jason@example.com...</text><text x="24" y="94" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">OK</text><text x="24" y="113" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ cf service-key demo-node-uaa demo-key | tail -n +2 | jq -r '.credentials.url'</text><text x="24" y="132" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">https://trial-dev-demo-node.authentication.ap10.hana.ondemand.com</text><text x="24" y="151" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ TOKEN_URL=&quot;$(cf service-key demo-node-uaa demo-key | tail -n +2 | jq -r '.credentials.url')/oauth/token&quot;</text><text x="24" y="170" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ CLIENT_ID=$(cf service-key demo-node-uaa demo-key | tail -n +2 | jq -r '.credentials.clientid')</text><text x="24" y="189" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ export CLIENT_SECRET='&lt;只放在环境变量里，不要写进脚本和聊天记录&gt;'</text><text x="24" y="227" font-size="12.5" fill="#e3d18a" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace"> ① client_credentials —— 技术用户（API 对 API）</text><text x="24" y="246" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s -X POST &quot;$TOKEN_URL&quot; -u &quot;$CLIENT_ID:$CLIENT_SECRET&quot; -d 'grant_type=client_credentials' \</text><text x="24" y="265" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">    | jq -r .access_token | cut -c1-32</text><text x="24" y="284" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">eyJhbGciOiJSUzI1NiIsImtpZCI6ImRlZmF1bHQifQ</text><text x="24" y="303" font-size="12.5" fill="#e3d18a" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace"> 该 token 只有 system-user 角色，业务 scope 一个也没有 → 访问业务接口 403</text><text x="24" y="322" font-size="12.5" fill="#e3d18a" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace"> （这正是 curl 冒烟测试必须用业务用户 token 的原因）</text><text x="24" y="360" font-size="12.5" fill="#e3d18a" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace"> ② password —— 业务用户（需要该客户端允许 password 授权，且用户在默认 IdP 可直接登录）（~）</text><text x="24" y="379" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s -X POST &quot;$TOKEN_URL&quot; -u &quot;$CLIENT_ID:$CLIENT_SECRET&quot; \</text><text x="24" y="398" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">    -d 'grant_type=password&amp;username=order.admin@example.com&amp;password=&lt;口令&gt;' | jq -r .access_token &gt; /tmp/user.jwt</text><text x="24" y="417" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ python3 -c &quot;import sys,json,base64;p=sys.stdin.read().split('.')[1];print(json.loads(base64.urlsafe_b64decode(p+'='*(-len(p)%4)))['scope'])&quot; &lt; /tmp/user.jwt</text><text x="24" y="436" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">['openid', 'demo-node-trial-dev.view', 'demo-node-trial-dev.submit']</text><text x="24" y="474" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s -o /dev/null -w '%{http_code}\n' -H &quot;Authorization: Bearer $(cat /tmp/user.jwt)&quot; &quot;$SVC/BookOrders?\$top=1&quot;</text><text x="24" y="493" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">200</text><text x="24" y="512" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s -o /dev/null -w '%{http_code}\n' &quot;$SVC/BookOrders?\$top=1&quot;        # 不带 Authorization 头</text><text x="24" y="531" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">401</text><text x="24" y="550" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s -o /dev/null -w '%{http_code}\n' -H &quot;Authorization: Bearer $(cat /tmp/svc.jwt)&quot; &quot;$SVC/BookOrders?\$top=1&quot;</text><text x="24" y="569" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">403</text><text x="24" y="588" font-size="12.5" fill="#e3d18a" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace"> service token 有身份没 scope → 403；换成订单管理员用户 token → 200</text><path d="M161.0 680.0 L60.0 680.0" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="148" y="667" width="162.4" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="161" cy="680" r="10" fill="#aa0808"/><text x="161" y="684" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">1</text><text x="177" y="684.5" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">1. 技术 token 无角色</text><path d="M161.0 716.0 L60.0 716.0" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="148" y="703" width="170.08" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="161" cy="716" r="10" fill="#aa0808"/><text x="161" y="720" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">2</text><text x="177" y="720.5" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">2. scope 决定 200/403</text><path d="M161.0 752.0 L60.0 752.0" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="148" y="739" width="157.6" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="161" cy="752" r="10" fill="#aa0808"/><text x="161" y="756" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">3</text><text x="177" y="756.5" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">3. 没带 token = 401</text><path d="M161.0 788.0 L60.0 788.0" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="148" y="775" width="168.16" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="161" cy="788" r="10" fill="#aa0808"/><text x="161" y="792" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">4</text><text x="177" y="792.5" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">4. 有身份缺权限 = 403</text></svg>