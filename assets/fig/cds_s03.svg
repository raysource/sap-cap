olas,'Liberation Mono',monospace">/&gt; successfully deployed to db.sqlite</text><text x="24" y="265" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ python3 - &lt;&lt;'PY'</text><text x="24" y="284" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  import sqlite3</text><text x="24" y="303" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  c = sqlite3.connect(&quot;db.sqlite&quot;)</text><text x="24" y="322" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  q = &quot;select name, type from sqlite_master where type in ('table','view') order by type, name&quot;</text><text x="24" y="341" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  for n, t in c.execute(q): print(f&quot;{t:5} {n}&quot;)</text><text x="24" y="360" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">  PY</text><text x="24" y="398" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">table BookOrderService_BookOrders_drafts</text><text x="24" y="417" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">table DRAFT_DraftAdministrativeData</text><text x="24" y="436" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">table cds_outbox_Messages</text><text x="24" y="455" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">table sap_training_bookorder_BookOrderItems</text><text x="24" y="474" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">table sap_training_bookorder_BookOrders</text><text x="24" y="493" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">table sap_training_bookorder_Books</text><text x="24" y="512" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">table sap_training_bookorder_Customers</text><text x="24" y="531" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">view  BookOrderService_BookOrderItems</text><text x="24" y="550" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">view  BookOrderService_BookOrders</text><text x="24" y="569" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">view  BookOrderService_Books</text><text x="24" y="588" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">view  BookOrderService_Customers</text><text x="24" y="607" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">view  BookOrderService_DraftAdministrativeData</text><text x="24" y="626" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">view  BookOrderService_OrderItemView</text><text x="24" y="645" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">view  sap_training_bookorder_OrderItemView</text><path d="M586.2 186.9 L245.2 186.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="573.25" y="173.875" width="197.92" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="586.25" cy="186.875" r="10" fill="#aa0808"/><text x="586.25" y="190.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">1</text><text x="602.25" y="191.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">1. 每个 CSV 一行初始化日志</text><path d="M623.8 224.9 L162.8 224.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="610.75" y="211.875" width="166.72" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="623.75" cy="224.875" r="10" fill="#aa0808"/><text x="623.75" y="228.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">2</text><text x="639.75" y="229.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">2. 只有这一行才算成功</text><path d="M391.2 471.9 L170.2 471.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="378.25" y="458.875" width="198.4" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="391.25" cy="471.875" r="10" fill="#aa0808"/><text x="391.25" y="475.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">3</text><text x="407.25" y="476.375" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">3. 4 张业务表 → 4 张物理表</text><path d="M395.0 395.9 L174.0 395.9" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="382" y="382.875" width="293.44" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="395" cy="395.875" r="10" fill="#aa0808"/><text x="395" y="399.875" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helv