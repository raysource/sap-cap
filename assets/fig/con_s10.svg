<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img"><rect x="0" y="0" width="1440" height="900" fill="#f5f6f7"/><rect x="0" y="0" width="1440" height="34" fill="#252526"/><circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="38" cy="17" r="6" fill="#ffbd2e"/><circle cx="56" cy="17" r="6" fill="#27c93f"/><text x="720" y="21.5" font-size="12.5" fill="#c8c8c8" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">jason@MacBook-Pro: ~/sap-cap/project-code/demo-node — 一次请求的往返</text><rect x="0" y="34" width="1440" height="866" fill="#1b1b1b"/><text x="24" y="56" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -u alice:alice -o /dev/null -w '%{http_code}\n' \</text><text x="24" y="75" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">    &quot;http://localhost:4004/odata/v4/book-order/BookOrders?\$top=2&quot;</text><text x="24" y="94" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">200</text><text x="24" y="113" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -o /dev/null -w '%{http_code}\n' &quot;http://localhost:4004/odata/v4/book-order/BookOrders&quot;   # 匿名</text><text x="24" y="132" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">401</text><text x="24" y="151" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s -u alice:alice &quot;http://localhost:4004/odata/v4/book-order/getOrderTotal(orderNo='BO-1003')&quot;</text><text x="24" y="170" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">17400</text><text x="24" y="189" font-size="12.5" fill="#6fd36f" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">$ curl -s -u alice:alice -X POST \</text><text x="24" y="208" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">    &quot;http://localhost:4004/odata/v4/book-order/BookOrders(ID=...,IsActiveEntity=true)/submitOrder&quot; -d '{}'</text><text x="24" y="227" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">&quot;订单 BO-1001 已提交，合计 16000.00 JPY（3 行）&quot;</text><text x="24" y="265" font-size="12.5" fill="#e3d18a" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace"> 同时看服务端（cds watch 的那个窗口）：</text><text x="24" y="284" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">[odata] - GET /odata/v4/book-order/BookOrders { '$top': '2' }</text><text x="24" y="303" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">[odata] - GET /odata/v4/book-order/getOrderTotal(orderNo='BO-1003')</text><text x="24" y="322" font-size="12.5" fill="#e8e8e8" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">[odata] - POST /odata/v4/book-order/BookOrders(ID=...,IsActiveEntity=true)/submitOrder</text><text x="24" y="360" font-size="12.5" fill="#e3d18a" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace"> 请求顺序：OData 解析 → 认证(401/403 在此) → before → on/bound action → 数据库 → after → 响应</text><text x="24" y="379" font-size="12.5" fill="#e3d18a" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace"> 自定义 handler 里 req.reject(400/404/409) 直接变成 HTTP 状态码，见第 ⑤⑥⑦ 章</text><path d="M161.0 620.0 L60.0 620.0" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="148" y="607" width="182.08" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="161" cy="620" r="10" fill="#aa0808"/><text x="161" y="624" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">1</text><text x="177" y="624.5" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">1. URL = @path + 实体名</text><path d="M161.0 656.0 L60.0 656.0" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="148" y="643" width="154.72" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="161" cy="656" r="10" fill="#aa0808"/><text x="161" y="660" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">2</text><text x="177" y="660.5" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">2. 认证先于业务逻辑</text><path d="M161.0 692.0 L60.0 692.0" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="148" y="679" width="154.72" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="161" cy="692" r="10" fill="#aa0808"/><text x="161" y="696" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">3</text><text x="177" y="696.5" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">3. 函数走服务层聚合</text><path d="M161.0 728.0 L60.0 728.0" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="148" y="715" width="149.44" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="161" cy="728" r="10" fill="#aa0808"/><text x="161" y="732" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">4</text><text x="177" y="732.5" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">4. 动作 = 状态迁移</text></svg>