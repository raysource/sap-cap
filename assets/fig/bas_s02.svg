oke="#e5e5e5" stroke-width="1"/><text x="282" y="163.375" font-size="12.5" fill="#1d2d3e" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">bookorder</text><text x="1038" y="163.375" font-size="12.5" fill="#354a5f" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">RUNNING</text><rect x="278" y="176" width="1134" height="34" fill="none" stroke="#e5e5e5" stroke-width="1"/><text x="282" y="197.375" font-size="12.5" fill="#1d2d3e" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">hana-native</text><text x="1038" y="197.375" font-size="12.5" fill="#354a5f" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">STOPPED</text><rect x="0" y="0" width="1440" height="900" fill="#1d2d3e" opacity="0.35"/><rect x="242" y="136" width="960" height="640" rx="10" fill="#000000" opacity="0.18"/><rect x="240" y="130" width="960" height="640" rx="10" fill="#ffffff"/><text x="262" y="162" font-size="17" fill="#1d2d3e" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">Create Dev Space</text><text x="262" y="184" font-size="12.5" fill="#6a6d70" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">名称 + Type（Kind）为必填；Additional SAP Extensions 可稍后修改</text><line x1="240" y1="196" x2="1200" y2="196" stroke="#e5e5e5" stroke-width="1"/><text x="262" y="229" font-size="12" fill="#6a6d70" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">Dev Space Name</text><rect x="262" y="235" width="916" height="26" rx="4" fill="#ffffff" stroke="#d9d9d9" stroke-width="1"/><text x="270" y="252.375" font-size="12.5" fill="#1d2d3e" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">bookorder</text><text x="1174" y="229" font-size="11.5" fill="#0070f2" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="end">只能用字母 / 数字 / - / _，不能有空格</text><text x="262" y="275" font-size="12" fill="#6a6d70" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">Type (Kind)</text><rect x="262" y="281" width="916" height="26" rx="4" fill="#ffffff" stroke="#d9d9d9" stroke-width="1"/><text x="270" y="298.375" font-size="12.5" fill="#1d2d3e" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">Full Stack Cloud Application</text><text x="1174" y="275" font-size="11.5" fill="#0070f2" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="end">CAP + SAP Fiori + Node.js / Java</text><text x="262" y="321" font-size="12" fill="#6a6d70" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">Additional SAP Extensions</text><rect x="262" y="327" width="916" height="26" rx="4" fill="#ffffff" stroke="#d9d9d9" stroke-width="1"/><text x="270" y="344.375" font-size="12.5" fill="#1d2d3e" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">SAP HANA Tools、SAP HANA Database Explorer</text><text x="1174" y="321" font-size="11.5" fill="#0070f2" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="end">需先 Stop 才能增删</text><text x="262" y="367" font-size="12" fill="#6a6d70" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">Disk Size</text><rect x="262" y="373" width="916" height="26" rx="4" fill="#ffffff" stroke="#d9d9d9" stroke-width="1"/><text x="270" y="390.375" font-size="12.5" fill="#1d2d3e" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">4 GB（试用 / 免费上限；Standard 计划 10 GB）</text><text x="1174" y="367" font-size="11.5" fill="#0070f2" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="end">超限会导致无法启动</text><rect x="262" y="408" width="916" height="37" rx="6" fill="#e8f0fb"/><circle cx="278" cy="426.5" r="8" fill="#0070f2"/><text x="278" y="430.5" font-size="11" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">!</text><text x="294" y="430" font-size="12.5" fill="#1d2d3e" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">Full Stack Cloud Application 预置扩展：CAP Tools、CDS Graphical Modeler、MTA Tools、SAP HANA Database Explorer、SAP Fiori Tools。</text><rect x="262" y="455" width="916" height="37" rx="6" fill="#fdf3e8"/><circle cx="278" cy="473.5" r="8" fill="#e76500"/><text x="278" y="477.5" font-size="11" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">!</text><text x="294" y="477" font-size="12.5" fill="#1d2d3e" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">创建后状态为 STARTING；若已有 1 个 RUNNING（试用计划），新 dev space 会停在 STOPPED。</text><line x1="240" y1="714" x2="1200" y2="714" stroke="#e5e5e5" stroke-width="1"/><rect x="1042" y="727" width="142" height="30" rx="6" fill="#0070f2"/><text x="1113" y="746.375" font-size="12.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">Create Dev Space</text><rect x="957.5" y="727" width="74.5" height="30" rx="6" fill="#ffffff" stroke="#d9d9d9" stroke-width="1"/><text x="994.75" y="746.375" font-size="12.5" fill="#0070f2" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="600">Cancel</text><path d="M73.4 161.2 L312.4 161.2" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="60.375" y="148.25" width="166.72" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="73.375" cy="161.25" r="10" fill="#aa0808"/><text x="73.375" y="165.25" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">1</text><text x="89.375" y="165.75" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">1. 名称建议与项目同名</text><path d="M585.0 296.2 L364.0 296.2" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="572" y="283.25" width="126.88" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="585" cy="296.25" r="10" fill="#aa0808"/><text x="585" y="300.25" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">2</text><text x="601" y="300.75" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">2. CAP 的 kind</text><path d="M627.2 342.2 L406.2 342.2" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="614.25" y="329.25" width="166.72" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="627.25" cy="342.25" r="10" fill="#aa0808"/><text x="627.25" y="346.25" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">3</text><text x="643.25" y="346.75" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">3. 额外扩展可事后再加</text><path d="M631.2 388.2 L410.2 388.2" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="618.25" y="375.25" width="214.72" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="631.25" cy="388.25" r="10" fill="#aa0808"/><text x="631.25" y="392.25" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">4</text><text x="647.25" y="392.75" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">4. 这是磁盘上限，不是内存配额</text></svg>