<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img"><rect x="0" y="0" width="1440" height="900" fill="#f5f6f7"/><rect x="0" y="0" width="1440" height="44" fill="#ffffff"/><line x1="0" y1="44" x2="1440" y2="44" stroke="#e5e5e5" stroke-width="1"/><rect x="14" y="13" width="60" height="18" rx="3" fill="#0070f2"/><text x="44" y="27" font-size="13" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">SAP</text><text x="84" y="27" font-size="13.5" fill="#1d2d3e" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">SAP Fiori</text><rect x="430" y="8" width="300" height="28" rx="6" fill="#f5f6f7" stroke="#e5e5e5" stroke-width="1"/><circle cx="448" cy="21" r="6" fill="none" stroke="#6a6d70" stroke-width="1.4"/><line x1="452" y1="25" x2="456" y2="29" stroke="#6a6d70" stroke-width="1.4"/><text x="466" y="26" font-size="12.5" fill="#6a6d70" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">Search</text><circle cx="1418" cy="22" r="13" fill="#e8f0fb"/><circle cx="1418" cy="19.76" r="3.2" fill="#7ba7d1"/><path d="M1413.0 30.0 q5.0 -8.3 10.1 0 Z" fill="#7ba7d1"/><text x="1378" y="27" font-size="13" fill="#6a6d70" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">?</text><text x="1350" y="27" font-size="13" fill="#6a6d70" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">⚙</text><text x="1322" y="27" font-size="13" fill="#6a6d70" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">🔔</text><text x="1280" y="27" font-size="12.5" fill="#354a5f" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="600">JASON</text><rect x="0" y="44" width="1440" height="50" fill="#ffffff"/><line x1="0" y1="94" x2="1440" y2="94" stroke="#e5e5e5" stroke-width="1"/><text x="28" y="76" font-size="19" fill="#1d2d3e" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">图书受注管理</text><text x="156" y="76" font-size="13" fill="#6a6d70" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">List Report</text><rect x="0" y="94" width="1440" height="30" fill="#f5f6f7"/><text x="28" y="114" font-size="12.5" fill="#6a6d70" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">Home  ›  图书受注管理  ›  订单列表</text><text x="28" y="147.95" font-size="15.5" fill="#1d2d3e" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">三份文件各管一件事（缺一份的表现不同）</text><rect x="28" y="160.15" width="1384" height="34" fill="#f5f6f7" stroke="#e5e5e5" stroke-width="1"/><text x="32" y="181.7" font-size="13" fill="#1d2d3e" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">文件</text><text x="389.931" y="181.7" font-size="13" fill="#1d2d3e" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">决定什么</text><text x="867.172" y="181.7" font-size="13" fill="#1d2d3e" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700">只改这里会看到什么</text><rect x="28" y="194.15" width="1384" height="34" fill="none" stroke="#e5e5e5" stroke-width="1"/><text x="32" y="215.7" font-size="13" fill="#1d2d3e" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">srv/book-order-service.cds</text><text x="389.931" y="215.7" font-size="13" fill="#354a5f" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">实体集、动作、草稿开关、URL 前缀</text><text x="867.172" y="215.7" font-size="13" fill="#354a5f" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">找不到实体集 / $metadata 里没有这个 EntitySet</text><rect x="28" y="228.15" width="1384" height="34" fill="none" stroke="#e5e5e5" stroke-width="1"/><text x="32" y="249.7" font-size="13" fill="#1d2d3e" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">app/book-orders/annotations.cds</text><text x="389.931" y="249.7" font-size="13" fill="#354a5f" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">表格列、筛选字段、页头、按钮</text><text x="867.172" y="249.7" font-size="13" fill="#354a5f" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">页面能开但是空表（No data）或没有任何列</text><rect x="28" y="262.15" width="1384" height="34" fill="none" stroke="#e5e5e5" stroke-width="1"/><text x="32" y="283.7" font-size="13" fill="#1d2d3e" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">app/book-orders/webapp/manifest.json</text><text x="389.931" y="283.7" font-size="13" fill="#354a5f" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">用哪个模板、连哪个服务、路由</text><text x="867.172" y="283.7" font-size="13" fill="#354a5f" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">整页白屏，控制台第一条是模板加载失败</text><text x="28" y="318.5" font-size="13" fill="#6a6d70" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">manifest.json 的 dataSources.uri 指向 /odata/v4/book-order/，注解文件里的 UI.* 会被编译进这个服务的 $metadata —— 这就是三者的接缝。</text><rect x="28" y="332.3" width="1384" height="37" rx="6" fill="#e8f0fb"/><circle cx="44" cy="350.8" r="8" fill="#0070f2"/><text x="44" y="354.8" font-size="11" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">!</text><text x="60" y="354.3" font-size="12.5" fill="#1d2d3e" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">排查顺序建议倒过来：先看 manifest.json（能不能起）→ 再看服务（连不连得上）→ 最后看注解（长什么样）。</text><path d="M601.8 247.5 L140.8 247.5" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="588.81" y="234.49" width="136.96" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="601.81" cy="247.49" r="10" fill="#aa0808"/><text x="601.81" y="251.49" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">1</text><text x="617.81" y="251.99" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">1. 注解=列与筛选</text><path d="M924.2 316.3 L463.2 316.3" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="911.24" y="303.29" width="169.12" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="924.24" cy="316.29" r="10" fill="#aa0808"/><text x="924.24" y="320.29" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">2</text><text x="940.24" y="320.79" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">2. 注解要进 $metadata</text><path d="M1214.2 316.3 L463.2 316.3" fill="none" stroke="#aa0808" stroke-width="1.2" stroke-linecap="round"/><rect x="1201.24" y="303.29" width="162.88" height="26" rx="13" fill="#ffffff" stroke="#aa0808" stroke-width="1.2"/><circle cx="1214.24" cy="316.29" r="10" fill="#aa0808"/><text x="1214.24" y="320.29" font-size="11.5" fill="#ffffff" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="700">3</text><text x="1230.24" y="320.79" font-size="12" fill="#aa0808" font-family="'72','72full',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">3. uri 指向 CAP 服务</text></svg>